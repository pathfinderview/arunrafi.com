<body>
<canvas id="map" aria-label="Sector 8 on Diwali night, in 3D"></canvas>
<canvas id="stage" aria-label="The moment"></canvas>
<div id="markers" aria-label="Shararatein"></div>
<div id="toran" aria-hidden="true"></div>
<div id="side" aria-live="polite"></div>
<div id="dip" aria-hidden="true"></div>

<header id="top">
  <div class="logo"><b>PATAKHA</b><i>'97</i></div>
  <div class="right">
    <div id="meter" role="status" title="Shararat-o-meter"><b>😇</b><span>Masoom</span><i></i></div>
    <button id="zoom" aria-label="Poora mohalla dekho">🔭</button>
    <button id="share" aria-label="Share">📤</button>
    <button id="sound" aria-label="Sound">🔊</button>
  </div>
</header>

<button id="back" aria-label="Wapas gali mein">←</button>
<button id="light" hidden aria-label="Jalao">🔥<small>Jalao</small></button>
<div id="done" hidden>
  <button id="stamp">✋ Maine bhi kiya hai!</button>
  <button id="again" aria-label="Ek aur baar">↻</button>
</div>

<section id="title">
  <div class="t-inner">
    <p class="place">Sector 8, Faridabad · Diwali 1997</p>
    <h1>PATAKHA<i>'97</i></h1>
    <p class="sub">Gali ke chhote shaitaanon ki saari shararatein.<br>Jalao. Bhaago. Aur batao: <b>maine bhi kiya hai!</b></p>
    <button id="go">Chalo, gali mein! 🧨</button>
    <p class="fine">Sound on karo. Headphones ho toh aur maza.</p>
  </div>
</section>
