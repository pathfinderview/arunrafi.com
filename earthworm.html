/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

 <article class="discovery" id="squeeze"><div class="discovery-copy"><p class="eyebrow">01 / A SKELETON YOU CAN POUR</p><h2>How does a squeeze<br>become a stretch?</h2><p>Pick a set of muscles. Pull the slider. Watch the other dimension change.</p><p>The fluid inside a body section barely compresses. When muscles narrow the section, that fluid needs somewhere to go. The section gets longer.</p><p class="insight">A worm can reach forward by squeezing inward.</p>${Qn("Two sets of muscles. One rule.","Circular muscles wrap around the body. Longitudinal muscles run along it. One set narrows and lengthens; the other shortens and widens. The soft walls change shape around almost the same volume of fluid. Biologists call this a hydrostatic skeleton.")}${Qn("What is missing from this drawing?","A real section contains a gut and other tissues as well as fluid. Here we isolate the fluid chamber and enlarge its muscles. The percentages compare this drawing with its relaxed shape; they are not measurements of a particular worm.")}</div><div class="experiment"><div class="experiment-tabs" role="group" aria-label="Choose muscles"><button data-muscle="ring" aria-pressed="true">Ring muscles</button><button data-muscle="length" aria-pressed="false">Lengthwise muscles</button></div><div class="experiment-art" id="chamber-art"></div><div class="experiment-key"><span><i style="--c:#985e4a"></i>Muscle</span><span><i style="--c:#79a9a8"></i>Fluid inside</span></div><label class="experiment-slider">Pull the muscles <input id="squeeze-slider" type="range" min="0" max="100" value="0"><output id="squeeze-value">Relaxed</output></label><div class="measurements"><div><strong id="length-value">100%</strong><span>Length</span></div><div><strong id="width-value">100%</strong><span>Width</span></div><div><strong id="volume-value">100%</strong><span>Fluid volume</span></div></div><p class="experiment-result" id="chamber-result" aria-live="polite"></p></div></article>
 <article class="discovery" id="grip"><div class="discovery-copy"><p class="eyebrow">02 / THE PART A WRIGGLE HIDES</p><h2>Moving a body.<br>Moving somewhere.</h2><p>Give both drawings the same stretch and pull. Only the upper one has a hold on the ground.</p><p>First, the back holds while the front reaches. Then the front holds while the back catches up. The body returns to its old length in a new place.</p><p class="insight">The step is in the change of grip.</p>${Qn("Where are its feet?","Tiny bristles project from much of the body. They are called setae or chaetae. They grip surfaces while muscles do the moving. A real earthworm spreads these jobs across many sections in travelling waves. The drawing reduces that sequence to two holds so the idea is easy to see.")}${Qn("Why does the lower worm stay put?","This is an ideal comparison with no useful grip and symmetric slipping. Real surfaces have friction, and a real worm may still make some progress. The point is to separate a change in shape from a change in position. This is not a soil-contact simulation.")}</div><div class="experiment"><div class="crawl-heading"><span>With a grip</span><output id="grip-distance">Ready to reach</output></div><div class="experiment-art crawl-art" id="grip-art"></div><div class="crawl-heading"><span>Without a useful grip</span><output id="slip-distance">Same starting place</output></div><div class="experiment-art crawl-art" id="slip-art"></div><div class="experiment-controls"><button id="play-step">Play one step</button><button id="reset-step">Start again</button></div><label class="experiment-slider">Explore the step <input id="step-slider" type="range" min="0" max="100" value="0"><output id="step-value">0%</output></label><p class="experiment-result" id="step-result" aria-live="polite">Watch the two ends take turns holding the ground.</p></div></article>
 <article class="discovery" id="breathe"><div class="discovery-copy"><p class="eyebrow">03 / A BREATH WITH NO BREATHING MOTION</p><h2>The doorway<br>is the skin.</h2><p>A worm can lie still and keep taking in oxygen. There is no chest to lift. Oxygen dissolves in a wet film, crosses the skin, and enters the blood.</p><p>Switch the surface from moist to dry. Follow the blue dots. The missing wet layer changes the route.</p><p class="insight">Dampness is part of its breathing system.</p>${Qn("Could a worm breathe underwater?","It can, if the water contains enough dissolved oxygen. Water itself does not automatically suffocate an earthworm. Drying out is dangerous because it loses the moist surface that gas exchange depends on.")}${Qn("Where does the oxygen go next?","Blood vessels carry oxygen through the body. Contracting vessels and muscular arches help move the blood. The skin is the entrance, not the whole journey. The blue dots are enlarged route markers; their speed is not a measured breathing rate.")}</div><div class="experiment"><div class="experiment-tabs" role="group" aria-label="Skin moisture"><button data-moist="true" aria-pressed="true">Moist skin</button><button data-moist="false" aria-pressed="false">Dry skin</button><button id="breath-play">${Rh?"Play oxygen":"Pause oxygen"}</button></div><div class="experiment-art" id="breath-art"></div><div class="experiment-key"><span><i style="--c:#4d92a0"></i>Oxygen</span><span><i style="--c:#b98d7c"></i>Skin</span><span><i style="--c:#a45b50"></i>Blood vessel</span></div><p class="experiment-result" id="breath-result" aria-live="polite">Oxygen dissolves at the wet surface, then crosses into the body.</p><p class="experiment-note">A magnified slice through the body wall. Outside above; inside below. The wet film and oxygen are enlarged.</p></div></article>
 <article class="discovery" id="bite"><div class="discovery-copy"><p class="eyebrow">04 / A LEAF BECOMES A STRETCH</p><h2>No teeth.<br>Still a grinder.</h2><p>A decaying leaf enters a mouth with no teeth. Farther inside, strong muscles and swallowed grit do the crushing.</p><p>Follow one bite. At each stop, the body does a different job: taking in, holding, grinding, absorbing, letting go.</p><p class="insight">Eating and moving meet inside its cells: food and oxygen help release the energy for the next pull.</p>${Qn("Is the soil itself the food?","Earthworms feed in different ways. Many take in soil along with decaying organic matter and its microbes; others feed on leaf litter near the surface. The useful food is the organic material, not the mineral grains themselves.")}${Qn("What is the worm leaving behind?","Material that leaves the anus is called a casting. It contains material the gut did not absorb. Worms move and mix organic matter as they feed, but their effects depend on the habitat and the species.")}</div><div class="experiment"><div class="experiment-art" id="food-art"></div><div class="food-stops" role="group" aria-label="Follow a bite">${["Mouth","Crop","Gizzard","Intestine","Castings"].map((C,v)=>`<button data-stop="${v}" aria-pressed="${v===0}"><small>0${v+1}</small>${C}</button>`).join("")}</div><section class="food-explanation" aria-live="polite"><p class="eyebrow" id="food-verb"></p><h3 id="food-title"></h3><p id="food-detail"></p></section></div></article>
 <section class="discovery-ending"><p class="eyebrow">LOOK AT THE WORM AGAIN</p><h2>Same wriggle.<br>More to see.</h2><p>A patch of soil held by bristles. Fluid keeping a soft body firm. Oxygen crossing wet skin. A meal supplying the energy for another pull.</p><p>All of it, inside an animal small enough to disappear beneath a leaf.</p><a href="#app">Back to the whole worm \u2191</a></section>

:"The wet doorway is missing. Dry skin cannot support normal oxygen uptake.",x()}),e("breath-play").onclick=()=>{p=!p,e("breath-play").textContent=p?"Pause oxygen":"Play oxygen"},x();let b=[["TAKE IN","A mouth that pulls food in.","The mouth and muscular throat take in food. There are no teeth here. The bite continues along a narrow food pipe."],["HOLD","A waiting place, called the crop.","This thin-walled pouch holds food before it reaches the grinder. Storing and grinding are different jobs in different parts of the tube."],["GRIND","Teeth made of muscle and grit.","The gizzard squeezes food against swallowed grains of grit. A leaf fragment becomes smaller pieces, ready for the next stage. The gritty particles help do the work that teeth do in a mouth."],["ABSORB","A long wall that takes food in.","Digestive fluids break food down further. Nutrients cross the intestinal wall into the body. Smaller particles alone are not enough: food must be broken down into substances the body can absorb."],["LET GO","The journey ends in a casting.","Material the gut did not absorb leaves through the anus. The nutrients taken in along the way can help power a muscle, maintain tissue, or support growth. A meal has become part of a living body."]];function m(C){let v=[100,260,365,535,715],w=[15,31,33,18,10],M="";for(let S=0;S<5;S++)S<4&&(M+=jn(v[S],145,v[S+1],145,"#bda479",13)),S===3?M+=`<rect x="405" y="126" width="260" height="38" rx="18" fill="${C===S?"#a37c3d":"#bfaa7a"}"/>`:M+=`<ellipse cx="${v[S]}" cy="145" rx="${w[S]}" ry="${w[S]*1.2}" fill="${C===S?"#a37c3d":"#bfaa7a"}" stroke="#997d53" stroke-width="1.5"/>`;let A=v[C],_=C<2?`<path d="M${A-10} 139 q9 -16 22 -3 q-6 19 -22 3" fill="#5e7654"/>`:Array.from({length:C===2?6:10},(S,R)=>ns(A-16+R%4*11,134+Math.floor(R/4)*9,3,C===4?"#78644e":"#6f8051")).join("");if(C===2&&(_+=Array.from({length:5},(S,R)=>ns(A-23+R*10,160,2,"#645b4d")).join("")),C===3)for(let S of[-1,1])_+=Array.from({length:4},(R,N)=>jn(A-20+N*15,145+S*23,A-20+N*15, Its skin lets oxygen in. Its gut takes energy from decaying food. That energy powers the next squeeze.

What looks like a wriggle is a whole body working together.`,action:"Follow one small stretch",do:"stretch",question:"Where does a worm\u2019s step begin?",answer:"With a change of shape. Muscles push against the fluid inside the body. Bristles grip the ground, so stretching and shortening can move the worm instead of just changing its shape."},{view:"body",title:"How can water hold a body up?",body:`Press a sealed bag of water. It changes shape, but the water does not shrink.

A worm uses the same fact. Each body section holds fluid. Muscles wrapped around it squeeze it thinner, so it grows longer. Muscles running along it pull it shorter, so it grows wider.

The fluid gives the muscles something to push against. This soft support has a name: a hydrostatic skeleton.`,action:"Freeze the stretch",do:"pause",question:"When this section gets longer, what happens to its width?",answer:"It gets thinner. The same fluid must fit inside the new shape. The highlighted section lets you follow this trade: longer and thinner, shorter and wider."},{view:"body",title:"A stretch becomes a step.",body:`Stretching alone would leave a worm wriggling in one spot. It also needs a hold on the ground.

Tiny bristles catch against the soil. One part holds while another stretches ahead. Then the front gains a hold, and the body behind it pulls forward. These jobs pass along the worm in a wave.

Grip. Reach. Pull. A walk made of changing shapes.`,action:"Slow the wave",do:"stretch",question:"What would happen on a surface where the bristles could not grip?",answer:"The body could still stretch and shorten, but it would slip more. Movement needs both: muscles to change shape and a grip to push against. This model stays in place so we can study the wave."},{view:"air",title:"Every breath crosses its skin.",body:`Air sits in small spaces between grains of soil. Oxygen from that air dissolves in the wet film on a worm\u2019s skin. It crosses the skin into the body and blood. Blood carries it onward.

There is no chest rising and falling. No breath drawn through a nose. The exchange happens across its moist surface.

This is why damp earth is a place it can live. Moisture is part of how it breathes.`,action:"Watch oxygen move inward",do:"air",question:"Why can dry ground become dangerous for a worm?",answer:"Its skin can dry out. Without that wet surface, oxygen cannot pass into the body well enough. The blue dots show the inward route, enlarged and slowed for us to see."},{view:"food",title:"Yesterday\u2019s leaf. Today\u2019s movement.",body:`A worm takes in decaying matter. Food passes through its mouth into a tube that runs through the body. A pouch holds it. A muscular grinder, the gizzard, crushes it with help from swallowed grit.

Farther along, the intestine breaks food down and takes in nutrients. Cells use food and oxygen to release the energy that powers the muscles.

The next stretch is paid for by a meal.`,action:"Follow the food route",do:"bite",question:"How are the blue oxygen dots and the gold food dots part of the same story?",answer:"Food carries stored energy. Cells use oxygen to help release it. Muscles use that energy to contract. Breathing, eating and moving belong to one living process. The gold dots show a route, not real digestion speed."},{view:"body",title:"A world it can feel.",body:`An earthworm has no eyes. Light-sensitive cells in its skin help it sense light. It can also respond to touch and vibrations.

A simple brain and a nerve cord link the body\u2019s sections. The worm can respond to the ground around it without seeing a picture of that world.

The broad band near its head has another job: it helps make a cocoon for eggs. Even this small body has a way to begin another life.`,action:"Find the band near the head",do:"band",question:"Does having no eyes mean it cannot notice the world?",answer:"No. Seeing is one way to sense a place. A worm also has touch, vibration and light-sensitive skin. The band is called the clitellum; it appears in mature worms."},{view:"body",title:"Now the wriggle has a story.",body:`Fluid gives the body support. Muscles change its shape. Bristles turn those changes into a journey. Moist skin brings in oxygen. Food supplies the energy to keep going.

None of these jobs happens alone. A bite helps power a stretch. A breath helps power a pull. Each small movement depends on the rest of the animal.
