<style>
  :root{--bg:#e2dfda;--ink:#1f1d1a;--ink2:#6a645d;--ink3:#9b958e;--accent:#5f9e30}

  .hint{left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom));text-align:center;font-style:italic;font-size:14px;color:var(--ink3);margin:0;transition:opacity 1.4s}

<script type="module">
// ---------------------------------------------------------------------------
// Crocodile Jelly — No. 069, Material Studies
// ---------------------------------------------------------------------------
const overlay = document.getElementById('overlay');
const testCanvas = document.createElement('canvas');
if (!testCanvas.getContext('webgl2')) {
  overlay.textContent = 'This study needs WebGL 2. Your browser or device does not offer it, so the crocodile cannot be cast here.';
  throw new Error('WebGL2 unavailable');
}

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isMobile = matchMedia('(pointer: coarse)').matches || innerWidth < 760;

// ---------- maths helpers ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const smin=(a,b,k)=>{const h=clamp(0.5+0.5*(b-a)/k,0,1);return lerp(b,a,h)-k*h*(1-h);};
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry(69);

// ---------- the crocodile as a signed distance field (rest pose, body coords) ----------
// profile keys: [x, half-width, half-height, superellipse exponent]
const PROFILE=[[-1.63,0.006,0.008,2.2],[-1.45,0.035,0.065,2.4],[-1.15,0.075,0.125,2.6],[-0.85,0.125,0.185,2.8],
 [-0.58,0.215,0.19,3.0],[-0.3,0.3,0.17,3.2],[0.1,0.31,0.17,3.2],[0.45,0.265,0.16,3.0],[0.63,0.19,0.14,2.8],
 [0.8,0.21,0.135,3.0],[1.0,0.21,0.12,3.2],[1.15,0.165,0.09,3.2],[1.4,0.115,0.07,3.0],[1.52,0.1,0.065,2.8],
 [1.6,0.072,0.05,2.3],[1.645,0.006,0.006,2.0]];
const _pr=[0,0,0];
function profile(x,o){
  if(x<=PROFILE[0][0]){const a=PROFILE[0];o[0]=a[1];o[1]=a[2];o[2]=a[3];return o;}
  for(let i=0;i<PROFILE.length-1;i++){const a=PROFILE[i],b=PROFILE[i+1];
    if(x<=b[0]){const t=sstep(a[0],b[0],x);o[0]=lerp(a[1],b[1],t);o[1]=lerp(a[2],b[2],t);o[2]=lerp(a[3],b[3],t);return o;}}
  const a=PROFILE[PROFILE.length-1];o[0]=a[1];o[1]=a[2];o[2]=a[3];return o;
}
const zc = x => 0.06*Math.sin(x*1.25+0.5);              // gently curving spine (z offset)
const XM=0.84, YM0=0.09;                                   // corner of the mouth
const mouthY = x => YM0-0.05*(x-XM);                       // mouth line (tilts down toward the nose)
const JAW=17*Math.PI/180, JC=Math.cos(JAW), JS=Math.sin(JAW);
const rotOpen=(x,y)=>[XM+JC*(x-XM)-JS*(y-YM0), YM0+JS*(x-XM)+JC*(y-YM0)];   // closed -> open head frame
const rotClosed=(x,y)=>[XM+JC*(x-XM)+JS*(y-YM0), YM0-JS*(x-XM)+JC*(y-YM0)]; // open -> closed

function sdSwept(x,y,z){
  if(x<-1.64||x>1.655) return Math.max(-1.64-x,x-1.655)+0.01;
  profile(x,_pr); const w=_pr[0],h=_pr[1],n=_pr[2];
  const dy=Math.abs((y-h*0.9)/h), dz=Math.abs((z-zc(x))/w);
  const r=Math.pow(Math.pow(dy,n)+Math.pow(dz,n),1/n);
  return (r-1)*Math.min(w,h);
}
function topY(x,zr){ profile(x,_pr); const h=_pr[1],n=_pr[2]; return h*0.9+h*Math.pow(Math.max(0,1-Math.pow(Math.abs(zr),n)),1/n); }
function zHalf(x,y){ profile(x,_pr); const w=_pr[0],h=_pr[1],n=_pr[2]; const u=Math.abs((y-h*0.9)/h); return w*Math.pow(Math.max(0,1-Math.pow(u,n)),1/n); }
function sdCapT(px,py,pz,ax,ay,az,bx,by,bz,ra,rb){
  const pax=px-ax,pay=py-ay,paz=pz-az,bax=bx-ax,bay=by-ay,baz=bz-az;
  const h=clamp((pax*bax+pay*bay+paz*baz)/(bax*bax+bay*bay+baz*baz),0,1);
  const dx=pax-bax*h,dy=pay-bay*h,dz=paz-baz*h;
  return Math.sqrt(dx*dx+dy*dy+dz*dz)-(ra+(rb-ra)*h);
}
function sdEll(px,py,pz,rx,ry,rz){
  const k0=Math.sqrt((px/rx)**2+(py/ry)**2+(pz/rz)**2);
  const k1=Math.sqrt((px/(rx*rx))**2+(py/(ry*ry))**2+(pz/(rz*rz))**2);
  if(k1<1e-9) return -Math.min(rx,ry,rz);
  return k0*(k0-1)/k1;
}
function sdTriIso(px,py,qx,qy){
  px=Math.abs(px);
  const t1=clamp((px*qx+py*qy)/(qx*qx+qy*qy),0,1); const ax=px-qx*t1, ay=py-qy*t1;
  const t2=clamp(px/qx,0,1); const bx=px-qx*t2, by=py-qy;
  const s=-Math.sign(qy);
  const dx=Math.min(ax*ax+ay*ay,bx*bx+by*by), dy=Math.min(s*(px*qy-py*qx),s*(py-qy));
  return -Math.sqrt(dx)*Math.sign(dy);
}
const LEGS={front:{xb:0.42,toes:5},hind:{xb:-0.42,toes:4}};
function sdLegs(x,y,z){
  const L=x<0?LEGS.hind:LEGS.front; const xb=L.xb; profile(xb,_pr); const w=_pr[0]; const zb=zc(xb);
  const s=(z-zb)<0?-1:1; const z0=zb+s*w*0.7;
  let d=sdCapT(x,y,z, xb,0.115,z0, xb-0.07,0.105,z0+s*0.16, 0.072,0.058);
  d=smin(d,sdCapT(x,y,z, xb-0.07,0.105,z0+s*0.16, xb+0.01,0.045,z0+s*0.27, 0.058,0.045),0.02);
  const Fx=xb+0.06,Fy=0.02,Fz=z0+s*0.3;
  d=smin(d,sdEll(x-Fx,y-Fy,z-Fz,0.065,0.03,0.055),0.03);
  const base=Math.atan2(s*0.6,1), n=L.toes;
  for(let i=0;i<n;i++){const a=base+(-0.75+1.5*i/(n-1)); const cx=Math.cos(a),cz=Math.sin(a);
    d=smin(d,sdCapT(x,y,z, Fx+cx*0.03,0.02,Fz+cz*0.03, Fx+cx*0.115,0.013,Fz+cz*0.115, 0.018,0.011),0.012);}
  return d;
}
function sdCrest(x,y,z){
  if(x<-1.56||x>-0.52) return 1;
  const sp=0.068; const i=Math.round((x+1.56)/sp); const xi=-1.56+i*sp; if(xi>-0.55) return 1;
  profile(xi,_pr); const wi=_pr[0],hi=_pr[1]; const topi=hi*1.9-0.012; const ph=0.03+0.4*hi;
  const merge=sstep(-1.32,-1.05,xi); const zoff=0.5*wi*merge;
  const dzr=Math.abs(Math.abs(z-zc(xi))-zoff)-0.011;
  const d2=sdTriIso(x-xi,(topi+ph)-y,0.026,ph);
  const ax=Math.max(d2,0),az=Math.max(dzr,0);
  return Math.min(Math.max(d2,dzr),0)+Math.sqrt(ax*ax+az*az);
}
function sdScutes(x,y,z){
  if(x<-0.98||x>0.72||y<0.05) return 1;
  const sp=0.092; const i=Math.round((x+0.98)/sp); const xi=-0.98+i*sp;
  profile(xi,_pr); const wi=_pr[0];
  const zr=(z-zc(xi))/wi; const rs=0.3; const ri=clamp(Math.round(zr/rs),-2,2);
  const yt=topY(xi,ri*rs); const sc=0.7+0.3*sstep(-0.9,-0.3,xi);
  let d=sdEll(x-xi,y-(yt-0.006),z-(zc(xi)+ri*rs*wi),0.034*sc,0.021*sc,0.021*sc);
  // bigger pair on the nape
  const nx=0.66; const ynt=topY(nx,0.33);
  d=Math.min(d,sdEll(x-nx,y-(ynt-0.008),Math.abs(z-zc(nx))-0.33*0.19,0.05,0.03,0.03));
  return d;
}
const EYE_X=0.93, EYE_Z=0.115, EYE_BUMP_Y=topY(0.93,0.115/0.21)-0.008;
function sdHeadClosed(x,y,z){
  let d=sdSwept(x,y,z);
  const bz=Math.abs(z-zc(EYE_X))-EYE_Z;
  const bd=Math.sqrt((x-EYE_X)**2+(y-EYE_BUMP_Y)**2+bz*bz)-0.04;
  return smin(d,bd,0.02);
}
function sdCroc(x,y,z){
  const ds=sdSwept(x,y,z);
  let d=Math.max(ds,x-(XM+0.03));                                     // body, cut at the hinge
  d=Math.min(d,Math.max(ds,y-mouthY(x),(XM-0.05)-x));                 // lower jaw: solid bar below the mouth line
  d=smin(d,sdEll(x-1.17,y-(mouthY(1.17)-0.012),z-zc(1.17),0.3,0.03,0.1),0.02); // tongue pad
  const rc=rotClosed(x,y);                                            // upper head, swung up 17°
  let du=Math.max(sdHeadClosed(rc[0],rc[1],z),mouthY(rc[0])-rc[1],XM-rc[0]);
  du=Math.max(du,-sdEll(rc[0]-1.22,rc[1]-(mouthY(1.22)-0.016),z-zc(1.22),0.3,0.036,0.1)); // palate hollow
  d=smin(d,du,0.03);
  d=smin(d,sdLegs(x,y,z),0.045);
  d=smin(d,sdCrest(x,y,z),0.012);
  d=smin(d,sdScutes(x,y,z),0.015);
  return Math.max(d,-y);                                              // belly pressed into the table
}
function sdCream(x,y,z){
  const inset=0.018; const ds=sdSwept(x,y,z)+inset;
  profile(x,_pr); const h=_pr[1];
  const line=h*0.9*0.8+0.016*Math.abs(Math.sin(x*26.0));              // scalloped line low on the flank
  let d=Math.max(ds,y-line,x-(XM+0.02));
  d=Math.min(d,Math.max(ds,y-(mouthY(x)-0.008),(XM-0.05)-x));        // the whole lower jaw is cream
  d=Math.min(d,Math.max(sdLegs(x,y,z)+inset,y-0.06));
  { const rc=rotClosed(x,y);                                          // cream skull inside the upper head, above the palate
    let du=Math.max(sdSwept(rc[0],rc[1],z)+0.022,(mouthY(rc[0])+0.02)-rc[1],(XM+0.04)-rc[0],rc[0]-1.52);
    du=Math.max(du,-sdEll(rc[0]-1.22,rc[1]-(mouthY(1.22)-0.016),z-zc(1.22),0.33,0.062,0.125));
    d=Math.min(d,du); }
  return Math.max(d,-y+0.004);
}
function isMouth(x,y){
  if(x<XM+0.01) return false; if(y<mouthY(x)-0.012) return false;
  const rc=rotClosed(x,y); return rc[1]<=mouthY(rc[0])+0.012;
}

// ---------- grids ----------
const HS = isMobile?0.0175:0.014;     // surface-nets sample spacing
const HL = HS*5;                      // lattice spacing
const OX=-1.75, OY=0, OZ=-0.77;
const NCX=Math.round(3.5/HL), NCY=Math.ceil(0.62/HL), NCZ=Math.round(1.54/HL);
const NX=NCX*5+1, NY=NCY*5+1+2, NZ=NCZ*5+1;   // fine grid; two sample rows below the table
const fy = j => OY+(j-2)*HS;

function sampleField(sdf){
  const F=new Float32Array(NX*NY*NZ);
  const cn=new Float32Array((NCX+1)*(NCY+1)*(NCZ+1));
  for(let i=0;i<=NCX;i++)for(let j=0;j<=NCY;j++)for(let k=0;k<=NCZ;k++)
    cn[(i*(NCY+1)+j)*(NCZ+1)+k]=sdf(OX+i*HL,OY+j*HL,OZ+k*HL);
  const skip=new Float32Array(NCX*NCY*NCZ); // 0 = evaluate, else the fill value
  for(let i=0;i<NCX;i++)for(let j=0;j<NCY;j++)for(let k=0;k<NCZ;k++){
    let m=1e9,s=0;
    for(let c=0;c<8;c++){const v=cn[((i+(c&1))*(NCY+1)+(j+((c>>1)&1)))*(NCZ+1)+(k+(c>>2))]; m=Math.min(m,Math.abs(v)); s=v;}
    skip[(i*NCY+j)*NCZ+k]= m>0.3 ? Math.sign(s)*0.3 : 0;
  }
  let inside=0;
  for(let i=0;i<NX;i++){const ci=Math.min(NCX-1,(i/5)|0); const x=OX+i*HS;
    for(let j=0;j<NY;j++){const y=fy(j);
      for(let k=0;k<NZ;k++){const idx=(i*NY+j)*NZ+k;
        if(j<2){F[idx]=HS;continue;}
        const cj=Math.min(NCY-1,((j-2)/5)|0), ck=Math.min(NCZ-1,(k/5)|0);
        const sv=skip[(ci*NCY+cj)*NCZ+ck];
        const d= sv!==0 ? sv : sdf(x,y,OZ+k*HS);
        F[idx]=d; if(d<0) inside++;
      }}}
  return {F,inside};
}

// ---------- surface nets ----------
function surfaceNets(F){
  const cellV=new Int32Array((NX-1)*(NY-1)*(NZ-1)).fill(-1);
  const cid=(i,j,k)=>(i*(NY-1)+j)*(NZ-1)+k;
  const fid=(i,j,k)=>(i*NY+j)*NZ+k;
  const pos=[]; const EDGES=[[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]];
  const cv=new Float32Array(8);
  for(let i=0;i<NX-1;i++)for(let j=0;j<NY-1;j++)for(let k=0;k<NZ-1;k++){
    let mask=0;
    for(let c=0;c<8;c++){const v=F[fid(i+(c&1),j+((c>>1)&1),k+(c>>2))]; cv[c]=v; if(v<0) mask|=1<<c;}
    if(mask===0||mask===255) continue;
    let sx=0,sy=0,sz=0,cnt=0;
    for(let e=0;e<12;e++){const a=EDGES[e][0],b=EDGES[e][1]; const da=cv[a],db=cv[b];
      if((da<0)===(db<0)) continue;
      const t=da/(da-db);
      const ax=a&1,ay=(a>>1)&1,az=a>>2, bx=b&1,by=(b>>1)&1,bz=b>>2;
      sx+=ax+(bx-ax)*t; sy+=ay+(by-ay)*t; sz+=az+(bz-az)*t; cnt++;}
    cellV[cid(i,j,k)]=pos.length/3;
    pos.push(OX+(i+sx/cnt)*HS, fy(j)+sy/cnt*HS, OZ+(k+sz/cnt)*HS);
  }
  const idx=[];
  const quad=(a,b,c,d,flip)=>{ if(a<0||b<0||c<0||d<0) return; if(flip){idx.push(a,c,b,a,d,c);} else {idx.push(a,b,c,a,c,d);} };
  for(let i=0;i<NX-1;i++)for(let j=0;j<NY-1;j++)for(let k=0;k<NZ-1;k++){
    const d0=F[fid(i,j,k)]; const in0=d0<0;
    if(i>0&&j>0&&k>0){ /* nothing */ }
    // x edge
    if(j>0&&k>0){const d1=F[fid(i+1,j,k)]; if((d1<0)!==in0) quad(cellV[cid(i,j-1,k-1)],cellV[cid(i,j,k-1)],cellV[cid(i,j,k)],cellV[cid(i,j-1,k)],!in0);}
    // y edge
    if(i>0&&k>0){const d1=F[fid(i,j+1,k)]; if((d1<0)!==in0) quad(cellV[cid(i-1,j,k-1)],cellV[cid(i-1,j,k)],cellV[cid(i,j,k)],cellV[cid(i,j,k-1)],!in0);}
    // z edge
    if(i>0&&j>0){const d1=F[fid(i,j,k+1)]; if((d1<0)!==in0) quad(cellV[cid(i-1,j-1,k)],cellV[cid(i,j-1,k)],cellV[cid(i,j,k)],cellV[cid(i-1,j,k)],!in0);}
  }
  return {pos:new Float32Array(pos), idx:new Uint32Array(idx)};
}

// ---------- build everything ----------
const T0=performance.now();
const crocField=sampleField(sdCroc);
const creamField=sampleField(sdCream);
const jellyNets=surfaceNets(crocField.F);
const creamNets=surfaceNets(creamField.F);
const restVolume=crocField.inside*HS*HS*HS;

// body coordinates for the skin shader: (x along, arc round section, angle/pi, region)
function bodyAttr(px,py,pz){
  let x=px,y=py; let reg=0;
  if(x>XM-0.05){const rc=rotClosed(px,py); if(rc[1]>mouthY(rc[0])){x=rc[0];y=rc[1];}}
  profile(x,_pr); const w=_pr[0],h=_pr[1];
  const dy=y-h*0.9, dz=pz-zc(x); const ang=Math.atan2(dz,dy); const rEff=(w+h)*0.5;
  if(x>0.78) reg=1;

      f.p.x+=nx*pen; f.p.y+=ny*pen; f.p.z+=nz*pen; const vn=f.v.x*nx+f.v.y*ny+f.v.z*nz; if(vn<0){ f.v.x-=1.25*vn*nx; f.v.y-=1.25*vn*ny; f.v.z-=1.25*vn*nz; f.v.multiplyScalar(0.9); }
      px[i]-=nx*pen*0.35; px[i+1]-=ny*pen*0.35; px[i+2]-=nz*pen*0.35; pv[i]+=f.v.x*0.25; pv[i+1]+=f.v.y*0.25; pv[i+2]+=f.v.z*0.25; touched=true;}}
    if(touched&&f.state==='fly'&&f.v.length()<0.5) f.state='jelly';
    if(f.state!=='stomach'&&fishInMouth(f)){ f.mouthTime+=dt; if(f.v.length()<0.6||f.mouthTime>0.5) triggerSnap(); } else f.mouthTime=0;
    // orientation
    if(f.state==='fly'||f.state==='jelly'){ if(f.v.length()>0.2){ _v1.copy(f.v).normalize(); f.quat.setFromUnitVectors(_X,_v1); } }
    else if(f.flat){ f.quat.slerp(f.flat,1-Math.exp(-dt/0.12)); f.p.y=Math.min(f.p.y,0.03+0.0); if(f.p.y<0.027) f.p.y=0.027; }
    f.mesh.position.copy(f.p); f.mesh.quaternion.copy(f.quat);
  }
}

// ---------- per-frame geometry update ----------
const skinPos=jellyFull.getAttribute('position'), creamPosA=creamGeo.getAttribute('position');
const _rot=new THREE.Matrix4(), _p0=new THREE.Vector3(), _p1=new THREE.Vector3(), _p2=new THREE.Vector3(), _ax=new THREE.Vector3();
function updateGeometry(){
  skinPos.array.set(jellyEmb.eval()); skinPos.needsUpdate=true; jellyFull.computeVertexNormals(); jellyFull.getAttribute('normal').needsUpdate=true;
  creamPosA.array.set(creamEmb.eval()); creamPosA.needsUpdate=true; creamGeo.computeVertexNormals();
  anchorEmb.eval();
  // teeth
  for(let i=0;i<teeth.length;i++){const t=teeth[i]; anchorEmb.get(t.base,_p0); anchorEmb.get(t.tip,_p1); _ax.copy(_p1).sub(_p0).normalize(); _q.setFromUnitVectors(_Y,_ax);
    const r=t.big?0.012:0.0085, h=t.big?0.05:0.035; _m.compose(_p0,_q,_v1.set(r,h,r)); teethMesh.setMatrixAt(i,_m);}
  teethMesh.instanceMatrix.needsUpdate=true;
  // eyes
  for(let i=0;i<eyes.length;i++){const e=eyes[i]; anchorEmb.get(e.c,_p0); anchorEmb.get(e.f,_p1); anchorEmb.get(e.u,_p2);
    const z=_p1.sub(_p0).normalize(); const y=_p2.sub(_p0); y.addScaledVector(z,-y.dot(z)).normalize(); const x=_v1.crossVectors(y,z).normalize();
    _rot.makeBasis(x,y,z); eyeMeshes[i].quaternion.setFromRotationMatrix(_rot); eyeMeshes[i].position.copy(_p0);}
  for(let i=0;i<bubbles.length;i++){anchorEmb.get(bubbles[i].a,_p0); _m.compose(_p0,_q.identity(),_v1.setScalar(bubbles[i].r)); bubbleMesh.setMatrixAt(i,_m);}
  bubbleMesh.instanceMatrix.needsUpdate=true;
  if(meshLines.visible) meshLines.geometry.getAttribute('position').needsUpdate=true;
}
function readouts(){
  let vol=0; for(const c of volCells){const id=c.ids; const e=[0,0,0,0,0,0,0,0,0];
    const E=(a,b,k)=>{e[k]+=px[3*id[b]]-px[3*id[a]]; e[k+1]+=px[3*id[b]+1]-px[3*id[a]+1]; e[k+2]+=px[3*id[b]+2]-px[3*id[a]+2];};
    E(0,1,0);E(2,3,0);E(4,5,0);E(6,7,0); E(0,2,3);E(1,3,3);E(4,6,3);E(5,7,3); E(0,4,6);E(1,5,6);E(2,6,6);E(3,7,6);
    const det=(e[0]*(e[4]*e[8]-e[5]*e[7])-e[1]*(e[3]*e[8]-e[5]*e[6])+e[2]*(e[3]*e[7]-e[4]*e[6]))/64;
    vol+=Math.abs(det)*c.fr;}
  const mass=vol*Math.pow(1.35,3)*1300;
  let len=0; for(let i=1;i<spinePts.length;i++){anchorEmb.get(spinePts[i-1],_p0); anchorEmb.get(spinePts[i],_p1); len+=_p0.distanceTo(_p1);}
  anchorEmb.get(aPivot,_p0); anchorEmb.get(aLowerTip,_p1).sub(_p0); anchorEmb.get(aUpperTip,_p2).sub(_p0);
  const gape=Math.max(0,(_p1.angleTo(_p2)-restClosedGape))*180/Math.PI;
  return {mass, length:len*1.35, gape};
}

// ---------- interaction ----------
const ray=new THREE.Raycaster(); const ndc=new THREE.Vector2(); const tablePlane=new THREE.Plane(new THREE.Vector3(0,1,0),-0.1);
function toNDC(e){const r=canvas.getBoundingClientRect(); ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);}
function pointHeadAt(e){ toNDC(e); ray.setFromCamera(ndc,camera); if(ray.ray.intersectPlane(tablePlane,_v1)){ anchorEmb.get(aHead,_v2); sim.turnTarget=clamp(Math.atan2(_v1.z-_v2.z,_v1.x-_v2.x),-0.5,0.5); } }
canvas.addEventListener('pointerdown',(e)=>{
  if(grab.active&&e.pointerId!==grab.id){ grab.second=e.pointerId; grab.secondX=e.clientX; e.stopImmediatePropagation(); return; }
  toNDC(e); ray.setFromCamera(ndc,camera);
  jellyFull.computeBoundingSphere(); skinGeo.boundingSphere=jellyFull.boundingSphere; mouthGeo.boundingSphere=jellyFull.boundingSphere;
  const hits=ray.intersectObjects([jelly,mouth],false);
  if(!hits.length) return;
  const hp=hits[0].point; grab.active=true; grab.id=e.pointerId; grab.twist=0; grab.nodes.length=0; grab.off.length=0;
  for(let n=0;n<N;n++){const dx=px[3*n]-hp.x,dy=px[3*n+1]-hp.y,dz=px[3*n+2]-hp.z; if(dx*dx+dy*dy+dz*dz<0.14*0.14){grab.nodes.push(n); grab.off.push(dx,dy,dz);}}
  grab.target.copy(hp); camera.getWorldDirection(_v1); grab.plane.setFromNormalAndCoplanarPoint(_v1,hp);
  controls.enabled=false; canvas.setPointerCapture(e.pointerId); e.stopImmediatePropagation(); e.preventDefault();
},{capture:true});
canvas.addEventListener('pointermove',(e)=>{
  if(grab.active&&e.pointerId===grab.second){ grab.twist+=(e.clientX-grab.secondX)*0.012; grab.secondX=e.clientX; return; }
  if(grab.active&&e.pointerId===grab.id){ toNDC(e); ray.setFromCamera(ndc,camera); if(ray.ray.intersectPlane(grab.plane,_v1)){ const dx=_v1.x-PED_C[0], dz=_v1.z-PED_C[1]; const r=Math.hypot(dx,dz), rm=PED_R-0.15; if(r>rm){ _v1.x=PED_C[0]+dx*rm/r; _v1.z=PED_C[1]+dz*rm/r; } _v1.y=clamp(_v1.y,0.02,1.6); grab.target.copy(_v1); } return; }
  if(e.pointerType==='mouse'||!grab.active) pointHeadAt(e);
});
const release=(e)=>{ if(e.pointerId===grab.second){grab.second=-1;return;} if(grab.active&&e.pointerId===grab.id){ grab.active=false; controls.enabled=true; try{canvas.releasePointerCapture(e.pointerId);}catch(_){} } };
canvas.addEventListener('pointerup',release); canvas.addEventListener('pointercancel',release);
canvas.addEventListener('wheel',(e)=>{ if(grab.active){ grab.twist+=e.deltaY*0.004; e.preventDefault(); } },{passive:false});

// ---------- UI ----------
const swEl=document.getElementById('swatches');
WAYS.forEach((w,i)=>{const b=document.createElement('button'); b.className='sw'; b.style.setProperty('--c',w.hex); b.setAttribute('aria-pressed',i===0?'true':'false'); b.title=w.name; b.innerHTML=`<i></i><span class="sr">${w.name}</span>`; b.addEventListener('click',()=>setWay(i)); swEl.appendChild(b);});
function setWay(i){ sim.way=i; const w=WAYS[i]; const c=new THREE.Color(w.hex);
  jellyMat.attenuationColor.copy(c); jellyMat.color.copy(c).lerp(new THREE.Color('#ffffff'),0.5);
  eyeMat.uniforms.uIris.value.set(w.iris); document.documentElement.style.setProperty('--accent',w.hex);
  for(const f of fishes) f.mat.color.set(w.fish);
  [...swEl.children].forEach((b,j)=>b.setAttribute('aria-pressed',j===i?'true':'false')); }
setWay(0);
document.getElementById('bFeed').addEventListener('click',feed);
document.getElementById('bSnap').addEventListener('click',triggerSnap);
document.getElementById('bThrash').addEventListener('click',triggerThrash);
function resetAll(){ px.set(rr); pv.fill(0); for(let c=0;c<C;c++){cquat[4*c]=0;cquat[4*c+1]=0;cquat[4*c+2]=0;cquat[4*c+3]=1;} for(const f of fishes) scene.remove(f.mesh); fishes.length=0; stomach.forEach(s=>s.used=false); swallowed=0; sim.snap=null; sim.thrashT=-10; sim.lungeT=-10; }
document.getElementById('bReset').addEventListener('click',resetAll);
const hint=document.getElementById('hint'); const hideHint=()=>hint.classList.add('off');
setTimeout(hideHint,7000); canvas.addEventListener('pointerdown',hideHint,{once:true,capture:true});
function togglePause(){ sim.paused=!sim.paused; }
function toggleMesh(){ meshLines.visible=!meshLines.visible; jelly.visible=cream.visible=mouth.visible=!meshLines.visible; }
addEventListener('keydown',(e)=>{ if(e.metaKey||e.ctrlKey||e.altKey) return; const k=e.key.toLowerCase();
  if(k==='f') feed(); else if(k==='s') triggerSnap(); else if(k==='t') triggerThrash(); else if(k==='r') resetAll();
  else if(k===' '){togglePause(); e.preventDefault();} else if(k==='m') toggleMesh(); else if(k==='q') sim.timeScale=sim.timeScale===1?0.25:1;
  else if(k>='1'&&k<='5') setWay(+k-1); else if(k==='['){sim.firm=clamp(sim.firm-0.1,0,1);} else if(k===']'){sim.firm=clamp(sim.firm+0.1,0,1);} });

// ---------- resize + loop ----------
const POSE={land:[3.1,2.7,5.3], port:[5.0,3.4,2.3]}; let poseMode="";
function resize(){const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h;
  // landscape: constant ~46° horizontal view. portrait: look down the snout so the body runs up the screen.
  const port=camera.aspect<1; const mode=port?'port':'land';
  let vf=port?56:2*Math.atan(Math.tan(23*Math.PI/180)/camera.aspect)*180/Math.PI;
  camera.fov=clamp(vf,24,60); camera.updateProjectionMatrix();
  if(mode!==poseMode){ poseMode=mode; const P=POSE[mode]; camera.position.set(P[0],P[1],P[2]).add(controls.target); controls.update(); }
}
addEventListener('resize',resize); resize();
// shelf mode: the Jelly Animals page shows this glass small and idle until it is picked
const shelfMode=new URLSearchParams(location.search).has('shelf'); let idle=false, idleN=0;
function setIdle(v){ idle=v; document.body.classList.toggle('idle',v); renderer.setPixelRatio(v?1:Math.min(devicePixelRatio,2)); controls.enabled=!v; resize(); }
addEventListener('message',(e)=>{ if(e.origin!==location.origin||!e.data||typeof e.data!=='object') return; if(e.data.type==='jelly-active') setIdle(false); else if(e.data.type==='jelly-idle') setIdle(true); });
if(shelfMode) setIdle(true);
let last=performance.now(), acc=0, frame=0, fpsT=0, fpsN=0;
const H=1/60;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  tick(dt);
}
function tick(dt){
  if(idle){ idleN=(idleN+1)%3; if(idleN) return; }
  fpsN++; fpsT+=dt; if(fpsT>1){sim.fps=Math.round(fpsN/fpsT); fpsT=0; fpsN=0;}
  if(!sim.paused){
    acc+=dt; let steps=0;
    while(acc>=H&&steps<3){ acc-=H; steps++; const h=H*sim.timeScale;
      sim.t+=h; sim.turn+=(sim.turnTarget-sim.turn)*(1-Math.exp(-h/0.5));
      updateJaw(h); updateRest(sim.t);
      const sdt=h/SUB; for(let s=0;s<SUB;s++) substep(sdt);
      dampInternal(); stepFish(h);
    }
    if(acc>=H) acc=0;
  }
  updateGeometry();
  frame++;
  _v1.copy(key.position).normalize().transformDirection(camera.matrixWorldInverse); eyeMat.uniforms.uLight.value.copy(_v1);
  if((frame++%4)===0){ let sx=0,sz=0; for(let n=0;n<3*N;n+=3){ sx+=px[n]; sz+=px[n+2]; } sx/=N; sz/=N;
    _v2.set(lerp(PED_C[0],sx,0.6),0.7,lerp(PED_C[1],sz,0.6)); _v3.copy(_v2).sub(controls.target).multiplyScalar(0.06); if(_v3.lengthSq()>1e-8){ controls.target.add(_v3); camera.position.add(_v3); } }
  controls.update(); renderer.render(scene,camera);
}
overlay.classList.add('off'); setTimeout(()=>{overlay.hidden=true;},1000);
window.__croc={camera,controls,sim,feed,triggerSnap,triggerThrash,THREE,jellyMat,setWay,fishes,anchorEmb,aMouthC,aMouthF,fishInMouth,tick};
requestAnimationFrame(loop);
</script>
