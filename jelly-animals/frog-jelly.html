<style>
  :root{--bg:#e2dfda;--ink:#1f1d1a;--ink2:#6a645d;--ink3:#9b958e;--accent:#2a5df2}
  *{box-sizing:border-box}

  .sw button[aria-pressed="true"] i{transform:scale(1.35);outline-color:var(--ink)}
  .acts{display:flex;gap:2px;align-items:center}

  .hint{left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom));text-align:center;font-style:italic;font-size:14px;color:var(--ink3);margin:0;transition:opacity 1.4s}

  .overlay.off{opacity:0;pointer-events:none}

  }

<canvas id="c" aria-label="Interactive jelly frog"></canvas>
<div class="ui title"><h1>Frog Jelly</h1><p>No. 070</p></div>

<div class="ui bar">
  <div class="sw" id="swatches"></div>

<script type="module">
// ---------------------------------------------------------------------------
// Frog Jelly — No. 070, Material Studies
// ---------------------------------------------------------------------------
const overlay = document.getElementById('overlay');
const testCanvas = document.createElement('canvas');
if (!testCanvas.getContext('webgl2')) {
  overlay.textContent = 'This study needs WebGL 2. Your browser or device does not offer it, so the frog cannot be cast here.';
  throw new Error('WebGL2 unavailable');
}

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isMobile = matchMedia('(pointer: coarse)').matches || innerWidth < 760;

// ---------- maths helpers ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const smin=(a,b,k)=>{const h=clamp(0.5+0.5*(b-a)/k,0,1);return lerp(b,a,h)-k*h*(1-h);};
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry(70);

// ---------- the frog as a signed distance field (rest pose, faces +x, sits on y=0) ----------
// profile keys: [x, half-width, half-height, centre height, superellipse exponent]
const PROFILE=[[-0.7,0.05,0.05,0.2,2.0],[-0.56,0.3,0.21,0.25,2.2],[-0.33,0.43,0.31,0.31,2.4],[-0.06,0.47,0.34,0.33,2.6],
 [0.24,0.47,0.33,0.32,2.6],[0.48,0.46,0.29,0.29,2.6],[0.66,0.43,0.23,0.26,2.6],[0.82,0.34,0.16,0.22,2.5],[0.94,0.19,0.08,0.2,2.2],[1.02,0.02,0.02,0.2,2.0]];
const _pr=[0,0,0,0];
function profile(x,o){
  if(x<=PROFILE[0][0]){const a=PROFILE[0];o[0]=a[1];o[1]=a[2];o[2]=a[3];o[3]=a[4];return o;}
  for(let i=0;i<PROFILE.length-1;i++){const a=PROFILE[i],b=PROFILE[i+1];
    if(x<=b[0]){const t=sstep(a[0],b[0],x);o[0]=lerp(a[1],b[1],t);o[1]=lerp(a[2],b[2],t);o[2]=lerp(a[3],b[3],t);o[3]=lerp(a[4],b[4],t);return o;}}
  const a=PROFILE[PROFILE.length-1];o[0]=a[1];o[1]=a[2];o[2]=a[3];o[3]=a[4];return o;
}
const XJ=0.5, YJ=0.22;                                      // corner of the mouth (jaw pivot)
const yM = x => 0.2+0.02*(1.02-x)/0.52;                     // mouth line, a shallow smile rising to the corners
const JAW=3*Math.PI/180, JC=Math.cos(JAW), JS=Math.sin(JAW);
const rotOpenLow=(x,y)=>[XJ+JC*(x-XJ)+JS*(y-YJ), YJ-JS*(x-XJ)+JC*(y-YJ)];   // closed -> open (lower jaw swings down)
const rotClosedLow=(x,y)=>[XJ+JC*(x-XJ)-JS*(y-YJ), YJ+JS*(x-XJ)+JC*(y-YJ)]; // open -> closed

function sdSwept(x,y,z){
  if(x<-0.71||x>1.03) return Math.max(-0.71-x,x-1.03)+0.01;
  profile(x,_pr); const w=_pr[0],h=_pr[1],yc=_pr[2],n=_pr[3];
  const dy=Math.abs((y-yc)/h), dz=Math.abs(z/w);
  const r=Math.pow(Math.pow(dy,n)+Math.pow(dz,n),1/n);
  return (r-1)*Math.min(w,h);
}
function sdCapT(px,py,pz,ax,ay,az,bx,by,bz,ra,rb){
  const pax=px-ax,pay=py-ay,paz=pz-az,bax=bx-ax,bay=by-ay,baz=bz-az;
  const h=clamp((pax*bax+pay*bay+paz*baz)/(bax*bax+bay*bay+baz*baz),0,1);
  const dx=pax-bax*h,dy=pay-bay*h,dz=paz-baz*h;
  return Math.sqrt(dx*dx+dy*dy+dz*dz)-(ra+(rb-ra)*h);
}
function sdEll(px,py,pz,rx,ry,rz){
  const k0=Math.sqrt((px/rx)**2+(py/ry)**2+(pz/rz)**2);
  const k1=Math.sqrt((px/(rx*rx))**2+(py/(ry*ry))**2+(pz/(rz*rz))**2);
  if(k1<1e-9) return -Math.min(rx,ry,rz);
  return k0*(k0-1)/k1;
}
function sdTriIso(px,py,qx,qy){
  px=Math.abs(px);
  const t1=clamp((px*qx+py*qy)/(qx*qx+qy*qy),0,1); const ax=px-qx*t1, ay=py-qy*t1;
  const t2=clamp(px/qx,0,1); const bx=px-qx*t2, by=py-qy;
  const s=-Math.sign(qy);
  const dx=Math.min(ax*ax+ay*ay,bx*bx+by*by), dy=Math.min(s*(px*qy-py*qx),s*(py-qy));
  return -Math.sqrt(dx)*Math.sign(dy);
}
// hind legs: hip -> knee (back and out) -> ankle (forward) -> foot -> five webbed toes
const HIP=[-0.25,0.22,0.3], KNEE=[-0.74,0.2,0.56], ANKLE=[-0.3,0.07,0.7], FOOT=[0.22,0.035,0.64];
function sdThigh(x,y,z,s){ return sdCapT(x,y,z, HIP[0],HIP[1],s*HIP[2], KNEE[0],KNEE[1],s*KNEE[2], 0.105,0.075); }
function sdShin(x,y,z,s){
  let d=sdCapT(x,y,z, KNEE[0],KNEE[1],s*KNEE[2], ANKLE[0],ANKLE[1],s*ANKLE[2], 0.07,0.05);
  d=smin(d,sdCapT(x,y,z, ANKLE[0],ANKLE[1],s*ANKLE[2], FOOT[0],FOOT[1],s*FOOT[2], 0.05,0.036),0.02);
  const base=Math.atan2(s*0.25,1);
  for(let i=0;i<5;i++){const a=base+(-0.8+1.6*i/4); const cx=Math.cos(a),cz=Math.sin(a); const L=i===2?0.19:(i===1||i===3?0.17:0.14);
    d=smin(d,sdCapT(x,y,z, FOOT[0]+cx*0.02,0.03,s*FOOT[2]+cz*0.02, FOOT[0]+cx*L,0.018,s*FOOT[2]+cz*L, 0.02,0.013),0.012);
    d=smin(d,Math.sqrt((x-FOOT[0]-cx*(L+0.01))**2+(y-0.02)**2+(z-s*FOOT[2]-cz*(L+0.01))**2)-0.02,0.012);}
  // webbing: a thin fan between the toes
  { const lx=x-FOOT[0], lz=z-s*FOOT[2]; const ca=Math.cos(base),sa=Math.sin(base); const ux=ca*lx+sa*lz, uz=-sa*lx+ca*lz;
    const dw=sdTriIso(uz,ux,0.11,0.14); const dy=Math.abs(y-0.024)-0.011;
    const ax=Math.max(dw,0),ay=Math.max(dy,0); const web=Math.min(Math.max(dw,dy),0)+Math.sqrt(ax*ax+ay*ay);
    d=smin(d,web,0.01); }
  return d;
}
function sdHind(x,y,z){ const s=z<0?-1:1; return smin(sdThigh(x,y,z,s),sdShin(x,y,z,s),0.03); }
// front legs: shoulder -> elbow -> wrist -> four toes
const SH=[0.45,0.2,0.36], EL=[0.58,0.1,0.5], WR=[0.82,0.04,0.5];
function sdFront(x,y,z){
  const s=z<0?-1:1;
  let d=sdCapT(x,y,z, SH[0],SH[1],s*SH[2], EL[0],EL[1],s*EL[2], 0.06,0.045);
  d=smin(d,sdCapT(x,y,z, EL[0],EL[1],s*EL[2], WR[0],WR[1],s*WR[2], 0.045,0.034),0.02);
  const base=Math.atan2(s*0.15,1);
  for(let i=0;i<4;i++){const a=base+(-0.7+1.4*i/3); const cx=Math.cos(a),cz=Math.sin(a); const L=(i===1||i===2)?0.12:0.095;
    d=smin(d,sdCapT(x,y,z, WR[0]+cx*0.015,0.028,s*WR[2]+cz*0.015, WR[0]+cx*L,0.016,s*WR[2]+cz*L, 0.018,0.012),0.01);
    d=smin(d,Math.sqrt((x-WR[0]-cx*(L+0.01))**2+(y-0.018)**2+(z-s*WR[2]-cz*(L+0.01))**2)-0.018,0.01);}
  return d;
}
function sdLegs(x,y,z){ return Math.min(sdHind(x,y,z),sdFront(x,y,z)); }
const EYE=[0.6,0.42,0.2];
function sdEyeBulbs(x,y,z){ return Math.sqrt((x-EYE[0])**2+(y-EYE[1])**2+(Math.abs(z)-EYE[2])**2)-0.115; }
function sdHeadUpper(x,y,z){ return smin(sdSwept(x,y,z),sdEyeBulbs(x,y,z),0.045); }
function sdFrog(x,y,z){
  const ds=sdHeadUpper(x,y,z);
  let d=Math.max(ds,x-(XJ+0.03));                                              // body, cut at the hinge
  d=Math.min(d,Math.max(ds,yM(x)-y,XJ-x));                                      // upper head: above the mouth line
  d=Math.max(d,-sdEll(x-0.78,y-(yM(0.78)+0.01),z,0.22,0.024,0.16));             // palate hollow
  const rc=rotClosedLow(x,y);                                                   // lower jaw, swung down a little
  let dl=Math.max(sdSwept(rc[0],rc[1],z),rc[1]-yM(rc[0]),(XJ-0.05)-rc[0]);
  dl=smin(dl,sdEll(rc[0]-0.78,rc[1]-(yM(0.78)-0.008),z,0.21,0.018,0.14),0.02);   // tongue pad
  d=smin(d,dl,0.03);
  d=smin(d,sdLegs(x,y,z),0.04);
  return Math.max(d,-y);
}
function sdCream(x,y,z){
  const inset=0.02; const ds=sdSwept(x,y,z)+inset;
  profile(x,_pr); const h=_pr[1],yc=_pr[2];
  const line=yc-0.28*h+0.012*Math.abs(Math.sin(x*22.0));                       // scalloped line low on the flank
  let d=Math.max(ds,y-line,x-(XJ+0.02));
  { const rc=rotClosedLow(x,y); d=Math.min(d,Math.max(sdSwept(rc[0],rc[1],z)+inset,rc[1]-(yM(rc[0])-0.03),(XJ-0.05)-rc[0])); } // throat under the lower jaw
  d=Math.min(d,Math.max(sdLegs(x,y,z)+inset,y-0.05));
  { let du=Math.max(sdSwept(x,y,z)+0.022,(yM(x)+0.016)-y,(XJ+0.02)-x,x-0.99);                 // cream skull above the palate
    du=Math.max(du,-sdEll(x-0.78,y-(yM(0.78)+0.01),z,0.234,0.038,0.174)); d=Math.min(d,du); }
  return Math.max(d,-y+0.004);
}
function isMouth(x,y){
  if(x<XJ+0.01) return false; if(y>yM(x)+0.006) return false;
  const rc=rotClosedLow(x,y); return rc[1]>=yM(rc[0])-0.006;
}

// ---------- grids ----------
const HS = isMobile?0.016:0.013;      // surface-nets sample spacing
const HL = HS*5;                      // lattice spacing
const OX=-1.15, OY=0, OZ=-0.95;
const NCX=Math.round(2.45/HL), NCY=Math.ceil(0.8/HL), NCZ=Math.round(1.9/HL);
const NX=NCX*5+1, NY=NCY*5+1+2, NZ=NCZ*5+1;   // fine grid; two sample rows below the table
const fy = j => OY+(j-2)*HS;

function sampleField(sdf){
  const F=new Float32Array(NX*NY*NZ);
  const cn=new Float32Array((NCX+1)*(NCY+1)*(NCZ+1));
  for(let i=0;i<=NCX;i++)for(let j=0;j<=NCY;j++)for(let k=0;k<=NCZ;k++)
    cn[(i*(NCY+1)+j)*(NCZ+1)+k]=sdf(OX+i*HL,OY+j*HL,OZ+k*HL);
  const skip=new Float32Array(NCX*NCY*NCZ);
  for(let i=0;i<NCX;i++)for(let j=0;j<NCY;j++)for(let k=0;k<NCZ;k++){
    let m=1e9,s=0;
    for(let c=0;c<8;c++){const v=cn[((i+(c&1))*(NCY+1)+(j+((c>>1)&1)))*(NCZ+1)+(k+(c>>2))]; m=Math.min(m,Math.abs(v)); s=v;}
    skip[(i*NCY+j)*NCZ+k]= m>0.3 ? Math.sign(s)*0.3 : 0;
  }
  let inside=0;
  for(let i=0;i<NX;i++){const ci=Math.min(NCX-1,(i/5)|0); const x=OX+i*HS;
    for(let j=0;j<NY;j++){const y=fy(j);
      for(let k=0;k<NZ;k++){const idx=(i*NY+j)*NZ+k;
        if(j<2){F[idx]=HS;continue;}
        const cj=Math.min(NCY-1,((j-2)/5)|0), ck=Math.min(NCZ-1,(k/5)|0);
        const sv=skip[(ci*NCY+cj)*NCZ+ck];
        const d= sv!==0 ? sv : sdf(x,y,OZ+k*HS);
        F[idx]=d; if(d<0) inside++;
      }}}
  return {F,inside};
}

// ---------- surface nets ----------
function surfaceNets(F){
  const cellV=new Int32Array((NX-1)*(NY-1)*(NZ-1)).fill(-1);
  const cid=(i,j,k)=>(i*(NY-1)+j)*(NZ-1)+k;
  const fid=(i,j,k)=>(i*NY+j)*NZ+k;
  const pos=[]; const EDGES=[[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]];
  const cv=new Float32Array(8);
  for(let i=0;i<NX-1;i++)for(let j=0;j<NY-1;j++)for(let k=0;k<NZ-1;k++){
    let mask=0;
    for(let c=0;c<8;c++){const v=F[fid(i+(c&1),j+((c>>1)&1),k+(c>>2))]; cv[c]=v; if(v<0) mask|=1<<c;}
    if(mask===0||mask===255) continue;
    let sx=0,sy=0,sz=0,cnt=0;
    for(let e=0;e<12;e++){const a=EDGES[e][0],b=EDGES[e][1]; const da=cv[a],db=cv[b];
      if((da<0)===(db<0)) continue;
      const t=da/(da-db);
      const ax=a&1,ay=(a>>1)&1,az=a>>2, bx=b&1,by=(b>>1)&1,bz=b>>2;
      sx+=ax+(bx-ax)*t; sy+=ay+(by-ay)*t; sz+=az+(bz-az)*t; cnt++;}
    cellV[cid(i,j,k)]=pos.length/3;
    pos.push(OX+(i+sx/cnt)*HS, fy(j)+sy/cnt*HS, OZ+(k+sz/cnt)*HS);
  }
  const idx=[];
  const quad=(a,b,c,d,flip)=>{ if(a<0||b<0||c<0||d<0) return; if(flip){idx.push(a,c,b,a,d,c);} else {idx.push(a,b,c,a,c,d);} };
  for(let i=0;i<NX-1;i++)for(let j=0;j<NY-1;j++)for(let k=0;k<NZ-1;k++){
    const d0=F[fid(i,j,k)]; const in0=d0<0;
    if(j>0&&k>0){const d1=F[fid(i+1,j,k)]; if((d1<0)!==in0) quad(cellV[cid(i,j-1,k-1)],cellV[cid(i,j,k-1)],cellV[cid(i,j,k)],cellV[cid(i,j-1,k)],!in0);}
    if(i>0&&k>0){const d1=F[fid(i,j+1,k)]; if((d1<0)!==in0) quad(cellV[cid(i-1,j,k-1)],cellV[cid(i-1,j,k)],cellV[cid(i,j,k)],cellV[cid(i,j,k-1)],!in0);}
    if(i>0&&j>0){const d1=F[fid(i,j,k+1)]; if((d1<0)!==in0) quad(cellV[cid(i-1,j-1,k)],cellV[cid(i,j-1,k)],cellV[cid(i,j,k)],cellV[cid(i-1,j,k)],!in0);}
  }
  return {pos:new Float32Array(pos), idx:new Uint32Array(idx)};
}

// ---------- build everything ----------
const T0=performance.now();
const frogField=sampleField(sdFrog);
const creamField=sampleField(sdCream);
const jellyNets=surfaceNets(frogField.F);
const creamNets=surfaceNets(creamField.F);

// body coordinates for the skin shader: (x along, arc round section, angle/pi, region)
function bodyAttr(px,py,pz){
  profile(px,_pr); const w=_pr[0],h=_pr[1],yc=_pr[2];
  const ang=Math.atan2(pz,py-yc); const rEff=(w+h)*0.5;
  let reg=0;
  if(sdLegs(px,py,pz)<0.012&&sdSwept(px,py,pz)>0.005) reg=2;
  else if(sdEyeBulbs(px,py,pz)<0.015) reg=3;
  else if(px>XJ-0.1){ const d=Math.hypot(px-0.75,py-0.27,Math.abs(pz)-0.32); reg=1+0.4*Math.exp(-d*d/(0.1*0.1)); }
  return [px,ang*rEff,ang/Math.PI,reg];
}

// lattice bookkeeping
const nodeId=new Int32Array((NCX+1)*(NCY+1)*(NCZ+1)).fill(-1);
const cellMark=new Uint8Array(NCX*NCY*NCZ);
const cellFrac=new Float32Array(NCX*NCY*NCZ);

// ---------- interaction ----------
const ray=new THREE.Raycaster(); const ndc=new THREE.Vector2(); const tablePlane=new THREE.Plane(new THREE.Vector3(0,1,0),-0.1);
function toNDC(e){const r=canvas.getBoundingClientRect(); ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);}
function pointAt(e){ if(tongue.aim||tongue.active) return; toNDC(e); ray.setFromCamera(ndc,camera); if(ray.ray.intersectPlane(tablePlane,_v1)){ anchorEmb.get(aBody,_v2); sim.turnTarget=clamp(Math.atan2(_v1.z-_v2.z,_v1.x-_v2.x),-0.7,0.7); } }
canvas.addEventListener('pointerdown',(e)=>{
  if(grab.active&&e.pointerId!==grab.id){ grab.second=e.pointerId; grab.secondX=e.clientX; e.stopImmediatePropagation(); return; }
  toNDC(e); ray.setFromCamera(ndc,camera);
  jellyFull.computeBoundingSphere(); skinGeo.boundingSphere=jellyFull.boundingSphere; mouthGeo.boundingSphere=jellyFull.boundingSphere;
  const hits=ray.intersectObjects([jelly,mouth],false);
  if(!hits.length) return;
  const hp=hits[0].point; grab.active=true; grab.id=e.pointerId; grab.twist=0; grab.nodes.length=0; grab.off.length=0;
  for(let n=0;n<N;n++){const dx=px[3*n]-hp.x,dy=px[3*n+1]-hp.y,dz=px[3*n+2]-hp.z; if(dx*dx+dy*dy+dz*dz<0.13*0.13){grab.nodes.push(n); grab.off.push(dx,dy,dz);}}
  grab.target.copy(hp); camera.getWorldDirection(_v1); grab.plane.setFromNormalAndCoplanarPoint(_v1,hp);
  controls.enabled=false; canvas.setPointerCapture(e.pointerId); e.stopImmediatePropagation(); e.preventDefault();
},{capture:true});
canvas.addEventListener('pointermove',(e)=>{
  if(grab.active&&e.pointerId===grab.second){ grab.twist+=(e.clientX-grab.secondX)*0.012; grab.secondX=e.clientX; return; }
  if(grab.active&&e.pointerId===grab.id){ toNDC(e); ray.setFromCamera(ndc,camera); if(ray.ray.intersectPlane(grab.plane,_v1)){ const dx=_v1.x-PED_C[0], dz=_v1.z-PED_C[1]; const r=Math.hypot(dx,dz), rm=PED_R-0.15; if(r>rm){ _v1.x=PED_C[0]+dx*rm/r; _v1.z=PED_C[1]+dz*rm/r; } _v1.y=clamp(_v1.y,0.02,1.6); grab.target.copy(_v1); } return; }
  if(e.pointerType==='mouse'||!grab.active) pointAt(e);
});
const release=(e)=>{ if(e.pointerId===grab.second){grab.second=-1;return;} if(grab.active&&e.pointerId===grab.id){ grab.active=false; controls.enabled=true; try{canvas.releasePointerCapture(e.pointerId);}catch(_){} } };
canvas.addEventListener('pointerup',release); canvas.addEventListener('pointercancel',release);
canvas.addEventListener('wheel',(e)=>{ if(grab.active){ grab.twist+=e.deltaY*0.004; e.preventDefault(); } },{passive:false});

// ---------- UI ----------
const swEl=document.getElementById('swatches');
WAYS.forEach((w,i)=>{const b=document.createElement('button'); b.style.setProperty('--c',w.hex); b.setAttribute('aria-pressed',i===0?'true':'false'); b.title=w.name; b.innerHTML=`<i></i><span class="sr">${w.name}</span>`; b.addEventListener('click',()=>setWay(i)); swEl.appendChild(b);});
function setWay(i){ sim.way=i; const w=WAYS[i]; const c=new THREE.Color(w.hex);
  jellyMat.attenuationColor.copy(c); jellyMat.color.copy(c).lerp(new THREE.Color('#ffffff'),0.5);
  const lc=new THREE.Color(w.leg); uLegAtt.value.copy(lc); uLegDiff.value.copy(lc).lerp(new THREE.Color('#ffffff'),0.5); uSpots.value=w.spots;
  eyeMat.uniforms.uIris.value.set(w.iris); document.documentElement.style.setProperty('--accent',w.hex);
  [...swEl.children].forEach((b,j)=>b.setAttribute('aria-pressed',j===i?'true':'false')); }
setWay(0);
function resetAll(){ px.set(rr); pv.fill(0); for(let c=0;c<C;c++){cquat[4*c]=0;cquat[4*c+1]=0;cquat[4*c+2]=0;cquat[4*c+3]=1;} for(const f of flies) scene.remove(f.mesh); flies.length=0; stomach.forEach(s=>s.used=false); tongue.active=false; tongue.len=0; tongue.aim=false; sim.croakT=-10; sim.jumpT=-10; sim.legExt=0; }
document.getElementById('bFeed').addEventListener('click',feed);
document.getElementById('bCroak').addEventListener('click',triggerCroak);
document.getElementById('bJump').addEventListener('click',triggerJump);
document.getElementById('bReset').addEventListener('click',resetAll);
const hint=document.getElementById('hint'); const hideHint=()=>hint.classList.add('off');
setTimeout(hideHint,7000); canvas.addEventListener('pointerdown',hideHint,{once:true,capture:true});
function toggleMesh(){ meshLines.visible=!meshLines.visible; jelly.visible=cream.visible=mouth.visible=!meshLines.visible; }
addEventListener('keydown',(e)=>{ if(e.metaKey||e.ctrlKey||e.altKey) return; const k=e.key.toLowerCase();
  if(k==='f') feed(); else if(k==='c') triggerCroak(); else if(k==='j') triggerJump(); else if(k==='r') resetAll();
  else if(k===' '){sim.paused=!sim.paused; e.preventDefault();} else if(k==='m') toggleMesh(); else if(k==='q') sim.timeScale=sim.timeScale===1?0.25:1;
  else if(k>='1'&&k<='5') setWay(+k-1); else if(k==='['){sim.firm=clamp(sim.firm-0.1,0,1);} else if(k===']'){sim.firm=clamp(sim.firm+0.1,0,1);} });

// ---------- resize + loop ----------
const POSE={land:[2.7,1.9,3.1], port:[3.5,2.4,1.8]}; let poseMode='';
function resize(){const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h;
  const port=camera.aspect<1; const mode=port?'port':'land';
  let vf=port?56:2*Math.atan(Math.tan(23*Math.PI/180)/camera.aspect)*180/Math.PI;
  camera.fov=clamp(vf,24,60); camera.updateProjectionMatrix();
  if(mode!==poseMode){ poseMode=mode; const P=POSE[mode]; camera.position.set(P[0],P[1],P[2]).add(controls.target); controls.update(); }
}
addEventListener('resize',resize); resize();
// shelf mode: the Jelly Animals page shows this glass small and idle until it is picked
const shelfMode=new URLSearchParams(location.search).has('shelf'); let idle=false, idleN=0;
function setIdle(v){ idle=v; document.body.classList.toggle('idle',v); renderer.setPixelRatio(v?1:Math.min(devicePixelRatio,2)); controls.enabled=!v; resize(); }
addEventListener('message',(e)=>{ if(e.origin!==location.origin||!e.data||typeof e.data!=='object') return; if(e.data.type==='jelly-active') setIdle(false); else if(e.data.type==='jelly-idle') setIdle(true); });
if(shelfMode) setIdle(true);
let last=performance.now(), acc=0, frame=0, fpsT=0, fpsN=0;
const H=1/60;
function loop(now){ requestAnimationFrame(loop); const dt=Math.min(0.05,(now-last)/1000); last=now; tick(dt); }
function tick(dt){
  if(idle){ idleN=(idleN+1)%3; if(idleN) return; }
  fpsN++; fpsT+=dt; if(fpsT>1){sim.fps=Math.round(fpsN/fpsT); fpsT=0; fpsN=0;}
  if(!sim.paused){
    acc+=dt; let steps=0;
    while(acc>=H&&steps<3){ acc-=H; steps++; const h=H*sim.timeScale;
      sim.t+=h; sim.turn+=(sim.turnTarget-sim.turn)*(1-Math.exp(-h/0.4));
      updateMuscles(h); updateRest(sim.t);
      const sdt=h/SUB; for(let s=0;s<SUB;s++) substep(sdt);
      dampInternal(); stepFlies(h);
    }
    if(acc>=H) acc=0;
  }
  updateGeometry();
  _v1.copy(key.position).normalize().transformDirection(camera.matrixWorldInverse); eyeMat.uniforms.uLight.value.copy(_v1);
  if((frame++%4)===0){ let sx=0,sz=0; for(let n=0;n<3*N;n+=3){ sx+=px[n]; sz+=px[n+2]; } sx/=N; sz/=N;
    _v2.set(lerp(PED_C[0],sx,0.6),0.55,lerp(PED_C[1],sz,0.6)); _v3.copy(_v2).sub(controls.target).multiplyScalar(0.06); if(_v3.lengthSq()>1e-8){ controls.target.add(_v3); camera.position.add(_v3); } }
  controls.update(); renderer.render(scene,camera);
}
overlay.classList.add('off'); setTimeout(()=>{overlay.hidden=true;},1000);
window.__frog={camera,controls,sim,feed,triggerCroak,triggerJump,THREE,jellyMat,setWay,flies,anchorEmb,tongue,tick,N,C};
requestAnimationFrame(loop);
</script>
</body>
