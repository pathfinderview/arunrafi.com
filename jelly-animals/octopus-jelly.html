<!doctype html>

<head>

<style>
  :root{--bg:#e2dfda;--ink:#1f1d1a;--ink2:#6a645d;--ink3:#9b958e;--accent:#ef6a5a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

  .title{top:calc(24px + env(safe-area-inset-top));left:calc(28px + env(safe-area-inset-left))}

  .title p{margin:8px 0 0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3)}
  .bar{left:calc(20px + env(safe-area-inset-left));right:calc(20px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .sw{display:flex;gap:2px;padding-left:4px}
  .sw button{width:36px;height:44px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
  .sw button i{width:12px;height:12px;border-radius:50%;background:var(--c);display:block;box-shadow:inset 0 -2px 3px rgba(0,0,0,.2),inset 0 2px 3px rgba(255,255,255,.45);transition:transform .25s,outline-color .25s;outline:1px solid transparent;outline-offset:3px}
  .sw button[aria-pressed="true"] i{transform:scale(1.35);outline-color:var(--ink)}

  .hint{left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom));text-align:center;font-style:italic;font-size:14px;color:var(--ink3);margin:0;transition:opacity 1.4s}

  .overlay.off{opacity:0;pointer-events:none}
  .overlay[hidden]{display:none}

  .idle .ui,.idle .hint{display:none}
  @media (max-width:560px){

    .bar{left:calc(10px + env(safe-area-inset-left));right:calc(10px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom))}
    .acts button{padding:0 10px;font-size:13px}

  }
  @media (prefers-reduced-motion:reduce){ .sw button i,.acts button,.hint,.overlay{transition:none} }

<body>
<canvas id="c" aria-label="Interactive jelly octopus"></canvas>
<div class="ui title"><h1>Octopus Jelly</h1><p>No. 071</p></div>
<p class="ui hint" id="hint">Drag the jelly to pull it. Move around it and the arms follow.</p>
<div class="ui bar">
  <div class="sw" id="swatches"></div>
  <div class="acts">
    <button id="bReset">Reset</button>
    <button id="bWave">Wave</button>
    <button id="bInk">Ink</button>
    <button id="bFeed" class="primary">Feed</button>
  </div>
</div>
<div class="overlay" id="overlay">Casting the jelly…</div>

<script type="module">
// ---------------------------------------------------------------------------
// Octopus Jelly — No. 071, Material Studies
// ---------------------------------------------------------------------------
const overlay = document.getElementById('overlay');
const testCanvas = document.createElement('canvas');
if (!testCanvas.getContext('webgl2')) {
  overlay.textContent = 'This study needs WebGL 2. Your browser or device does not offer it, so the octopus cannot be cast here.';
  throw new Error('WebGL2 unavailable');
}

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isMobile = matchMedia('(pointer: coarse)').matches || innerWidth < 760;

// ---------- maths helpers ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const smin=(a,b,k)=>{const h=clamp(0.5+0.5*(b-a)/k,0,1);return lerp(b,a,h)-k*h*(1-h);};
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry(71);

function sdCapT(px,py,pz,ax,ay,az,bx,by,bz,ra,rb){
  const pax=px-ax,pay=py-ay,paz=pz-az,bax=bx-ax,bay=by-ay,baz=bz-az;
  const h=clamp((pax*bax+pay*bay+paz*baz)/(bax*bax+bay*bay+baz*baz),0,1);
  const dx=pax-bax*h,dy=pay-bay*h,dz=paz-baz*h;
  return Math.sqrt(dx*dx+dy*dy+dz*dz)-(ra+(rb-ra)*h);
}
function sdEll(px,py,pz,rx,ry,rz){
  const k0=Math.sqrt((px/rx)**2+(py/ry)**2+(pz/rz)**2);
  const k1=Math.sqrt((px/(rx*rx))**2+(py/(ry*ry))**2+(pz/(rz*rz))**2);
  if(k1<1e-9) return -Math.min(rx,ry,rz);
  return k0*(k0-1)/k1;
}

// ---------- the octopus: a mantle, a head with two eyes, a web and eight arms ----------
const CX=0.05, CZ=0;                            // centre of the arm crown, on the table
const MANTLE=[-0.02,0.5,0], MR=[0.42,0.46,0.42];
const EYE=[0.3,0.46,0.2];
function sdEyeBulbs(x,y,z){ return Math.sqrt((x-EYE[0])**2+(y-EYE[1])**2+(Math.abs(z)-EYE[2])**2)-0.115; }
function sdBody(x,y,z){
  let d=sdEll(x-MANTLE[0],y-MANTLE[1],z-MANTLE[2],MR[0],MR[1],MR[2]);          // mantle
  d=smin(d,sdEll(x-0.03,y-0.3,z,0.42,0.3,0.44),0.12);                          // a broad base
  d=smin(d,sdEyeBulbs(x,y,z),0.04);                                            // eye bulbs
  d=smin(d,sdEll(x-CX,y-0.05,z-CZ,0.4,0.11,0.4),0.16);                        // web skirt
  return d;
}
// arms: each is a heading field integrated along its length
const NA=8, NS=18, L=1.4, DS=L/NS;
const armR = s => lerp(0.125,0.016,Math.pow(s,0.8));
const ARMS=[];
for(let i=0;i<NA;i++){
  const th=Math.PI/8+i*Math.PI/4;
  const front=(i===0||i===7), back=(i===3||i===4);
  ARMS.push({th, sign:(i%2?1:-1), k:0.28+rnd()*0.4, lift: front?0.9:(back?0.55:0.7), ph:rnd()*6.28, wave:0, reach:0, az:th, wrap:0, st:0.7, pull:0, lift2:0,
    P:new Float32Array(3*(NS+1)), T:new Float32Array(3*(NS+1)), Nn:new Float32Array(3*(NS+1)), B:new Float32Array(3*(NS+1))});
}
function armCurve(A,t){
  // headings along the arm: a flat spiral plus a travelling wave, steered toward a target when reaching
  const P=A.P; let x=CX+Math.cos(A.th)*0.3, y=0.11, z=CZ+Math.sin(A.th)*0.3;
  const W=0.22+A.wave*0.75;
  for(let j=0;j<=NS;j++){
    const s=j/NS; P[3*j]=x;P[3*j+1]=y;P[3*j+2]=z;
    const sm=(j+0.5)/NS;
    let phi=A.th+A.sign*A.k*2.2*sm*sm+W*Math.sin(2*Math.PI*1.1*sm-2*Math.PI*t/3.2+A.ph)*sm;
    let psi=A.lift*sstep(0.6,1,sm)*2.3;
    if(A.reach>0){ const r=A.reach*sstep(0.05,0.3,sm); let ph2=A.az; if(A.wrap>0&&sm>A.st) ph2+=A.sign*A.wrap*(sm-A.st)/0.3*2*Math.PI; phi=lerp(phi,ph2,r); psi=lerp(psi,A.lift2*sstep(0.5,1,sm)*2.0,r); }
    let ds=DS*(1-0.55*A.pull*sstep(0.15,0.4,sm));
    x+=ds*Math.cos(psi)*Math.cos(phi); y+=ds*Math.sin(psi); z+=ds*Math.cos(psi)*Math.sin(phi);
    if(sm<0.4) y=Math.max(y,armR(sm)); else y=Math.max(y,armR(sm)*0.9);
    if(j<NS) y=Math.max(y, armR(s)*0.95);
  }
  // frames
  const T=A.T,Nn=A.Nn,B=A.B;
  for(let j=0;j<=NS;j++){ const a=j<NS?j:j-1; let tx=P[3*a+3]-P[3*a],ty=P[3*a+4]-P[3*a+1],tz=P[3*a+5]-P[3*a+2]; const l=Math.hypot(tx,ty,tz)||1; tx/=l;ty/=l;tz/=l;
    let nx,ny,nz; if(Math.abs(ty)<0.95){ nx=tz; ny=0; nz=-tx; } else { nx=0; ny=tz; nz=-ty; } const nl=Math.hypot(nx,ny,nz)||1; nx/=nl;ny/=nl;nz/=nl;
    const bx=ny*tz-nz*ty, by=nz*tx-nx*tz, bz=nx*ty-ny*tx;
    T[3*j]=tx;T[3*j+1]=ty;T[3*j+2]=tz; Nn[3*j]=nx;Nn[3*j+1]=ny;Nn[3*j+2]=nz; B[3*j]=bx;B[3*j+1]=by;B[3*j+2]=bz; }
}
for(const A of ARMS) armCurve(A,0);
const REST=ARMS.map(A=>({P:A.P.slice(),Nn:A.Nn.slice(),B:A.B.slice()}));
// arm bounds for quick rejection
const ARMB=ARMS.map(A=>{let cx=0,cy=0,cz=0; for(let j=0;j<=NS;j++){cx+=A.P[3*j];cy+=A.P[3*j+1];cz+=A.P[3*j+2];} cx/=NS+1;cy/=NS+1;cz/=NS+1; let r=0; for(let j=0;j<=NS;j++){r=Math.max(r,Math.hypot(A.P[3*j]-cx,A.P[3*j+1]-cy,A.P[3*j+2]-cz));} return [cx,cy,cz,r+0.2];});
function sdArm(i,x,y,z){
  const b=ARMB[i]; const dx=x-b[0],dy=y-b[1],dz=z-b[2]; const far=Math.sqrt(dx*dx+dy*dy+dz*dz)-b[3]; if(far>0.05) return far+0.05;
  const P=REST[i].P; let d=1e9;
  for(let j=0;j<NS;j++){ const s0=j/NS,s1=(j+1)/NS; d=Math.min(d,sdCapT(x,y,z,P[3*j],P[3*j+1],P[3*j+2],P[3*j+3],P[3*j+4],P[3*j+5],armR(s0),armR(s1))); }
  return d;
}
function sdSuckers(i,x,y,z){
  const b=ARMB[i]; const dx=x-b[0],dy=y-b[1],dz=z-b[2]; if(Math.sqrt(dx*dx+dy*dy+dz*dz)-b[3]>0.05) return 1;
  const P=REST[i].P,Nn=REST[i].Nn,B=REST[i].B; let d=1e9;
  for(let j=2;j<=NS;j++){ const s=j/NS; const r=armR(s); const rs=r*0.42; if(rs<0.011) break;
    for(let side=-1;side<=1;side+=2){ const px=P[3*j]+B[3*j]*r*0.92+Nn[3*j]*side*r*0.5, py=P[3*j+1]+B[3*j+1]*r*0.92+Nn[3*j+1]*side*r*0.5, pz=P[3*j+2]+B[3*j+2]*r*0.92+Nn[3*j+2]*side*r*0.5;
      const ddx=x-px,ddy=y-py,ddz=z-pz; const q=Math.sqrt(ddx*ddx+ddy*ddy+ddz*ddz); if(q>rs*2) continue;
      // flatten along B
      const alongB=ddx*B[3*j]+ddy*B[3*j+1]+ddz*B[3*j+2]; const rest2=q*q-alongB*alongB;
      d=Math.min(d,Math.sqrt(Math.max(0,rest2)/(rs*rs)+(alongB*alongB)/(rs*0.5*rs*0.5))*rs-rs); } }
  return d;
}
function sdArms(x,y,z){ let d=1e9; for(let i=0;i<NA;i++){ let a=sdArm(i,x,y,z); if(a<0.06) a=smin(a,sdSuckers(i,x,y,z),0.012); d=Math.min(d,a);} return d; }
function sdOcto(x,y,z){ let d=smin(sdBody(x,y,z),sdArms(x,y,z),0.05); return Math.max(d,-y); }
function sdCream(x,y,z){
  let d=sdEll(x-MANTLE[0],y-MANTLE[1]+0.02,z,MR[0]-0.09,MR[1]-0.1,MR[2]-0.09);           // the inner body, glowing through the dome
  d=Math.min(d,Math.max(sdEll(x-CX,y-0.09,z-CZ,0.44,0.11,0.44),y-0.05));                // pale underside of the web
  return Math.max(d,-y+0.004);
}

// ---------- grids ----------
const HS = isMobile?0.018:0.015;
const HL = HS*5;
const OX=-1.85, OY=0, OZ=-1.85;
const NCX=Math.round(3.7/HL), NCY=Math.ceil(1.1/HL), NCZ=Math.round(3.7/HL);
const NX=NCX*5+1, NY=NCY*5+1+2, NZ=NCZ*5+1;
const fy = j => OY+(j-2)*HS;

function sampleField(sdf){
  const F=new Float32Array(NX*NY*NZ);
  const cn=new Float32Array((NCX+1)*(NCY+1)*(NCZ+1));
  for(let i=0;i<=NCX;i++)for(let j=0;j<=NCY;j++)for(let k=0;k<=NCZ;k++)
    cn[(i*(NCY+1)+j)*(NCZ+1)+k]=sdf(OX+i*HL,OY+j*HL,OZ+k*HL);
  const skip=new Float32Array(NCX*NCY*NCZ);
  for(let i=0;i<NCX;i++)for(let j=0;j<NCY;j++)for(let k=0;k<NCZ;k++){
    let m=1e9,s=0;
    for(let c=0;c<8;c++){const v=cn[((i+(c&1))*(NCY+1)+(j+((c>>1)&1)))*(NCZ+1)+(k+(c>>2))]; m=Math.min(m,Math.abs(v)); s=v;}
    skip[(i*NCY+j)*NCZ+k]= m>0.28 ? Math.sign(s)*0.28 : 0;
  }
  let inside=0;
  for(let i=0;i<NX;i++){const ci=Math.min(NCX-1,(i/5)|0); const x=OX+i*HS;
    for(let j=0;j<NY;j++){const y=fy(j);
      for(let k=0;k<NZ;k++){const idx=(i*NY+j)*NZ+k;
        if(j<2){F[idx]=HS;continue;}
        const cj=Math.min(NCY-1,((j-2)/5)|0), ck=Math.min(NCZ-1,(k/5)|0);
        const sv=skip[(ci*NCY+cj)*NCZ+ck];
        const d= sv!==0 ? sv : sdf(x,y,OZ+k*HS);
        F[idx]=d; if(d<0) inside++;
      }}}
  return {F,inside};
}

// ---------- surface nets ----------
function surfaceNets(F){
  const cellV=new Int32Array((NX-1)*(NY-1)*(NZ-1)).fill(-1);
  const cid=(i,j,k)=>(i*(NY-1)+j)*(NZ-1)+k;
  const fid=(i,j,k)=>(i*NY+j)*NZ+k;
  const pos=[]; const EDGES=[[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]];
  const cv=new Float32Array(8);
  for(let i=0;i<NX-1;i++)for(let j=0;j<NY-1;j++)for(let k=0;k<NZ-1;k++){
    let mask=0;
    for(let c=0;c<8;c++){const v=F[fid(i+(c&1),j+((c>>1)&1),k+(c>>2))]; cv[c]=v; if(v<0) mask|=1<<c;}
    if(mask===0||mask===255) continue;
    let sx=0,sy=0,sz=0,cnt=0;
    for(let e=0;e<12;e++){const a=EDGES[e][0],b=EDGES[e][1]; const da=cv[a],db=cv[b];
      if((da<0)===(db<0)) continue;
      const t=da/(da-db);
      const ax=a&1,ay=(a>>1)&1,az=a>>2, bx=b&1,by=(b>>1)&1,bz=b>>2;
      sx+=ax+(bx-ax)*t; sy+=ay+(by-ay)*t; sz+=az+(bz-az)*t; cnt++;}
    cellV[cid(i,j,k)]=pos.length/3;
    pos.push(OX+(i+sx/cnt)*HS, fy(j)+sy/cnt*HS, OZ+(k+sz/cnt)*HS);
  }
  const idx=[];
  const quad=(a,b,c,d,flip)=>{ if(a<0||b<0||c<0||d<0) return; if(flip){idx.push(a,c,b,a,d,c);} else {idx.push(a,b,c,a,c,d);} };
  for(let i=0;i<NX-1;i++)for(let j=0;j<NY-1;j++)for(let k=0;k<NZ-1;k++){
    const d0=F[fid(i,j,k)]; const in0=d0<0;
    if(j>0&&k>0){const d1=F[fid(i+1,j,k)]; if((d1<0)!==in0) quad(cellV[cid(i,j-1,k-1)],cellV[cid(i,j,k-1)],cellV[cid(i,j,k)],cellV[cid(i,j-1,k)],!in0);}
    if(i>0&&k>0){const d1=F[fid(i,j+1,k)]; if((d1<0)!==in0) quad(cellV[cid(i-1,j,k-1)],cellV[cid(i-1,j,k)],cellV[cid(i,j,k)],cellV[cid(i,j,k-1)],!in0);}
    if(i>0&&j>0){const d1=F[fid(i,j,k+1)]; if((d1<0)!==in0) quad(cellV[cid(i-1,j-1,k)],cellV[cid(i,j-1,k)],cellV[cid(i,j,k)],cellV[cid(i-1,j,k)],!in0);}
  }
  return {pos:new Float32Array(pos), idx:new Uint32Array(idx)};
}

// ---------- build everything ----------
const T0=performance.now();
const octoField=sampleField(sdOcto);
const creamField=sampleField(sdCream);
const jellyNets=surfaceNets(octoField.F);
const creamNets=surfaceNets(creamField.F);

// nearest arm coordinates for a point: {i, s, dist, n, b}
const _ac={i:-1,s:0,d:1e9,n:0,b:0};
function armCoords(x,y,z,o){
  o.i=-1; o.d=1e9;
  for(let i=0;i<NA;i++){ const b=ARMB[i]; if(Math.hypot(x-b[0],y-b[1],z-b[2])>b[3]+0.1) continue; const P=REST[i].P;
    for(let j=0;j<NS;j++){ const ax=P[3*j],ay=P[3*j+1],az=P[3*j+2]; const bx=P[3*j+3]-ax,by=P[3*j+4]-ay,bz=P[3*j+5]-az;
      const h=clamp(((x-ax)*bx+(y-ay)*by+(z-az)*bz)/(bx*bx+by*by+bz*bz),0,1); const dx=x-ax-bx*h,dy=y-ay-by*h,dz=z-az-bz*h; const d=Math.sqrt(dx*dx+dy*dy+dz*dz);
      if(d<o.d){o.d=d;o.i=i;o.s=(j+h)/NS;} } }
  if(o.i>=0){ const R=REST[o.i]; const j=Math.min(NS-1,(o.s*NS)|0), f=o.s*NS-j; const px=lerp(R.P[3*j],R.P[3*j+3],f),py=lerp(R.P[3*j+1],R.P[3*j+4],f),pz=lerp(R.P[3*j+2],R.P[3*j+5],f);
    const dx=x-px,dy=y-py,dz=z-pz; o.n=dx*R.Nn[3*j]+dy*R.Nn[3*j+1]+dz*R.Nn[3*j+2]; o.b=dx*R.B[3*j]+dy*R.B[3*j+1]+dz*R.B[3*j+2]; }
  return o;
}
// body coordinates for the skin shader: (u, v, angle/pi, region)
function bodyAttr(px,py,pz){
  let reg=0; const db=sdBody(px,py,pz);
  armCoords(px,py,pz,_ac);
  if(_ac.i>=0&&_ac.d<armR(_ac.s)+0.03&&db>0.01){ reg=2; let sk=1; for(let i=0;i<NA;i++){ if(sdSuckers(i,px,py,pz)<0.008){sk=0;break;} } if(!sk) reg=4;
    const ang=Math.atan2(_ac.n,-_ac.b); return [_ac.s*L, ang*armR(_ac.s), ang/Math.PI, reg]; }
  if(sdEyeBulbs(px,py,pz)<0.015) reg=3; else { const d=Math.hypot(px-0.36,py-0.33,Math.abs(pz)-0.32); reg=0.4*Math.exp(-d*d/(0.11*0.11)); }
  const ang=Math.atan2(pz,px-MANTLE[0]); const r=Math.hypot(px-MANTLE[0],pz);
  return [py, ang*0.35, Math.atan2(r,py-MANTLE[1])/Math.PI, reg];
}

const ease=(cur,target,dt,tau)=>cur+(target-cur)*(1-Math.exp(-dt/tau));
function updateArms(dt){
  const t=sim.t;
  const wave=(t-sim.waveT>0&&t-sim.waveT<2.4)?Math.sin(Math.PI*(t-sim.waveT)/2.4):0;
  for(let i=0;i<NA;i++){ const A=ARMS[i];
    let reach=0, az=A.az, wrap=0, pull=0, lift2=0;
    const F=sim.feed;
    if(F&&F.arm===i){ az=F.az; reach=F.reach; wrap=F.wrap; pull=F.pull; lift2=0; }
    else if(sim.ptrOn&&sim.ptrArm===i){ az=sim.ptrAz; reach=0.75; lift2=0.6; }
    A.az=ease(A.az,az,dt,0.25); A.reach=ease(A.reach,reach,dt,0.3); A.wrap=ease(A.wrap,wrap,dt,0.2); A.pull=ease(A.pull,pull,dt,0.3); A.lift2=ease(A.lift2,lift2,dt,0.4);
    A.wave=ease(A.wave,wave,dt,0.2);

}
function F_active(){ return !!sim.feed; }
function triggerWave(){ sim.waveT=sim.t; }

const shelfMode=new URLSearchParams(location.search).has('shelf'); let idle=false, idleN=0;
function setIdle(v){ idle=v; document.body.classList.toggle('idle',v); renderer.setPixelRatio(v?1:Math.min(devicePixelRatio,2)); controls.enabled=!v; resize(); }
addEventListener('message',(e)=>{ if(e.origin!==location.origin||!e.data||typeof e.data!=='object') return; if(e.data.type==='jelly-active') setIdle(false); else if(e.data.type==='jelly-idle') setIdle(true); });
if(shelfMode) setIdle(true);
let last=performance.now(), acc=0, frame=0, fpsT=0, fpsN=0;
const H=1/60;
function loop(now){ requestAnimationFrame(loop); const dt=Math.min(0.05,(now-last)/1000); last=now; tick(dt); }
function tick(dt){
  if(idle){ idleN=(idleN+1)%3; if(idleN) return; }
  fpsN++; fpsT+=dt; if(fpsT>1){sim.fps=Math.round(fpsN/fpsT); fpsT=0; fpsN=0;}
  if(!sim.paused){
    acc+=dt; let steps=0;
    while(acc>=H&&steps<3){ acc-=H; steps++; const h=H*sim.timeScale;
      sim.t+=h;
      updateArms(h); updateRest(sim.t);
      const sdt=h/SUB; for(let s=0;s<SUB;s++) substep(sdt);
      dampInternal(); stepInk(h); stepShrimps(h);
    }
    if(acc>=H) acc=0;
  }
  updateGeometry();
  _v1.copy(key.position).normalize().transformDirection(camera.matrixWorldInverse); eyeMat.uniforms.uLight.value.copy(_v1);
  if((frame++%4)===0){ let sx=0,sz=0; for(let n=0;n<3*N;n+=3){ sx+=px[n]; sz+=px[n+2]; } sx/=N; sz/=N;
    _v2.set(lerp(PED_C[0],sx,0.6),0.35,lerp(PED_C[1],sz,0.6)); _v3.copy(_v2).sub(controls.target).multiplyScalar(0.06); if(_v3.lengthSq()>1e-8){ controls.target.add(_v3); camera.position.add(_v3); } }
  controls.update(); renderer.render(scene,camera);
}
overlay.classList.add('off'); setTimeout(()=>{overlay.hidden=true;},1000);
window.__octo={camera,controls,sim,feed,triggerInk,triggerWave,THREE,jellyMat,setWay,shrimps,anchorEmb,ARMS,tick,N,C};
requestAnimationFrame(loop);
</script>
