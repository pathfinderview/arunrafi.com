/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

or("#app").innerHTML='<main class="shell"><header class="mast"><a href="/tools.html">Arun Rafi / Studies</a><span>A SMALL CHANGE IN PERSPECTIVE</span><a href="/">Back to the writing \u2197</a></header><header class="heading"><div><p class="eyebrow">AN INTERACTIVE STUDY OF A SOLAR ECLIPSE</p><h1>The day the Sun<br>disappears.</h1></div><p class="intro">A Moon four hundred times narrower can hide a star.<br>Move it. Follow its shadow. Then stand inside it.</p></header><div class="layout"><section class="machine" aria-label="Eclipse model and controls"><div class="viewrow"><div class="views" role="group" aria-label="Choose a view"><button data-view="space" aria-pressed="true">From space</button><button data-view="ground" aria-pressed="false">From the ground</button><button data-view="distance" aria-pressed="false">True distance</button></div><button id="focus" aria-expanded="true" aria-controls="readout">Hide panel</button></div><div class="stage" role="img" aria-label="Interactive three-dimensional Sun, Moon and Earth, with incoming sunlight and the Moon\u2019s shadow. Drag to turn, scroll to zoom."><canvas id="space-canvas"></canvas><canvas class="big-sky" id="big-sky" hidden aria-label="The Sun and Moon as seen by the selected observer"></canvas><div id="loading" role="status">Finding our place in the light\u2026</div></div><div class="body-key" id="body-key"><span><i style="background:#f2b75b"></i>Sun</span><span><i style="background:#b2b1ab"></i>Moon</span><span><i style="background:#74a9db"></i>Earth</span></div><p class="hint"><span id="view-hint">Drag to turn \xB7 Scroll to look closer \xB7 Gold point: your place on Earth</span><span id="scale-note">Sun reduced \xB7 Earth\u2013Moon sizes proportional \xB7 Gaps shortened</span></p><div class="toolbar"><button id="play">Play the alignment</button><div class="preset-group" role="group" aria-label="Eclipse examples"><button data-preset="total" aria-pressed="true">Total</button><button data-preset="ring" aria-pressed="false">Ring of fire</button><button data-preset="partial" aria-pressed="false">Partial</button><button data-preset="miss" aria-pressed="false">Why it misses</button></div><span class="spacer"></span><button id="reset-view">Reset view</button></div></section><aside class="readout" id="readout"><div class="observer-head"><span><i class="status-dot"></i>YOUR SKY</span><span>SIMULATED VIEW</span></div><canvas class="observer-sky" id="observer-sky" aria-label="Sun coverage at the selected place on Earth"></canvas><h2 class="eclipse-type" id="eclipse-type">Total eclipse</h2><p class="coverage"><span id="coverage">100.0%</span> of the Sun\u2019s disc covered<br><span id="size-ratio">Moon looks 1.06\xD7 as wide</span></p><section class="story"><p class="eyebrow" id="chapter-progress">01 / 05 \xB7 FOLLOW THE LIGHT</p><h2 id="chapter-title"></h2><p id="chapter-text"></p><nav class="chapter-nav" aria-label="Story chapters"><button id="back">\u2190 Back</button><button id="next">Next \u2192</button></nav></section></aside></div><section class="controls" aria-label="Change the eclipse"><label class="control"><span class="control-head">Move the Moon across the Sun <output id="phase-value"></output></span><input id="phase" aria-label="Moon alignment" type="range" min="-1.2" max="1.2" step=".002" value="0"><p>A tiny change of alignment turns a hidden Sun into a bright crescent.</p></label><label class="control"><span class="control-head">Bring the Moon closer or farther <output id="distance-value"></output></span><input id="distance" aria-label="Moon distance" type="range" min="356500" max="406700" step="100" value="360000"><p>Farther away, it looks smaller. The Sun\u2019s size in the sky stays almost the same.</p></label><label class="control"><span class="control-head">Move across Earth\u2019s sunlit face <output id="site-value"></output></span><input id="site" aria-label="Observer position" type="range" min="-60" max="60" step=".1" value="0"><p>The gold point is your viewpoint. Leave the shadow and totality becomes partial.</p></label><label class="control"><span class="control-head">Tilt the Moon\u2019s orbit <output id="tilt-value"></output></span><input id="tilt" aria-label="Orbit tilt" type="range" min="0" max="5.145" step=".005" value="5.145"><p id="tilt-help">Use \u201CWhy it misses\u201D to see why most new moons do not bring an eclipse.</p></label></section><section class="facts" aria-label="What the model calculates"><div class="fact"><strong id="sun-angle"></strong><span>Sun\u2019s width in your sky</span></div><div class="fact"><strong id="moon-angle"></strong><span>Moon\u2019s width in your sky</span></div><div class="fact"><strong id="separation"></strong><span>Separation of their centres</span></div><div class="fact"><strong>29.5 days</strong><span>New moon to new moon, on average</span></div></section><section class="below"><div><p class="eyebrow">THE SURPRISE IS WHERE YOU STAND</p><h2>Nothing happened to the Sun.<br>Everything changed here.</h2><p>The Moon moves a little. Its shadow reaches a different patch of Earth. For one person, daylight fades into totality. Somewhere else, the Sun is barely touched.</p><p>The spectacle is made of ordinary things: light travelling in straight lines, a nearby Moon, and a particular place to stand.</p></div><div><details><summary>What is the dark cone?</summary><p>The umbra is where the Moon blocks the whole Sun. Around it is the penumbra, where only part is hidden. If the umbra ends before reaching the observer, an aligned Moon can leave a ring of sunlight: an annular eclipse. The outer cone is faintly outlined in the space view.</p></details><details><summary>Why do two views use different scales?</summary><p>In the close space view, the Sun is shown much smaller and the gaps are shortened so all three bodies fit. Earth and Moon keep their relative sizes. The shadow volume is stretched to meet that display geometry. In True distance, their sizes, separation and orbit are on one scale. The Sun is offscreen. The angular sizes, coverage and ground view always use physical distances in kilometres.</p></details><details><summary>How exact is this model?</summary><p>It uses spherical bodies, a circular lunar orbit at the distance you choose, a fixed Sun\u2013Earth distance, and an ideal observer on a spherical Earth. Disc overlap is calculated from apparent angular radii and separation. It omits terrain, refraction, limb darkening, Earth\u2019s obliquity, orbital eccentricity during a run, and the changing line of nodes. The map and observer are schematic, not a real city or a location prediction. The corona is an artistic rendering; the sky does not model daylight brightness. Animation timing is illustrative.</p></details><details><summary>References and image credits</summary><p><a href="https://science.nasa.gov/eclipses/geometry/">NASA: the geometry of eclipses</a> \xB7 <a href="https://science.nasa.gov/eclipses/future-eclipses/eclipse-2024/faq/">NASA: apparent size and eclipse types</a> \xB7 <a href="https://science.nasa.gov/moon/facts/">NASA: Moon facts</a>. Earth and Moon maps are from the <a href="https://github.com/mrdoob/three.js/tree/dev/examples/textures/planets">Three.js example textures</a>. Constants: Earth radius 6,371 km; Moon radius 1,737.4 km; Sun radius 695,700 km; Sun\u2013Earth distance 149,597,870 km. Built with Three.js and the Teardown build toolkit.</p></details></div></section><footer class="footer"><span>An interactive study by Arun Rafi \xB7 Follow a little light.</span><a href="/tools.html">Explore the other studies \u2197</a></footer></main>';var It=i=>document.getElementById(i);document.querySelector(".toolbar").append(It("focus"));var Iy=It("readout"),Ou=document.querySelector(".controls"),yc=document.querySelector(".story"),Ss=document.createElement("div");Ss.className="panel-tabs";Ss.setAttribute("role","group");Ss.setAttribute("aria-label","Explore or read");Ss.innerHTML='<button id="explore-tab" aria-pressed="true
